<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>New Calling Services</title>
  <style>
    /* Messenger-style app tray: one compact row at the bottom, the call video stays visible above. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 12px 10px;
      box-sizing: border-box;
    }
    .tray {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 14px 6px 10px;
      box-sizing: border-box;
      transition: opacity .2s ease, transform .25s cubic-bezier(.2, .8, .2, 1);
    }
    .tray.hidden {
      opacity: 0;
      transform: translateY(16px) scale(.96);
      pointer-events: none;
    }
    .handle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 14px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .handle::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      width: 32px;
      height: 4px;
      margin-left: -16px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
    }
    .row {
      display: flex;
      gap: 4px;
      justify-content: center;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      padding: 0 4px;
    }
    .row::-webkit-scrollbar {
      display: none;
    }
    .app {
      flex: 0 0 auto;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 0;
      padding: 0;
      background: none;
      color: #fff;
      cursor: pointer;
      scroll-snap-align: start;
    }
    .app .ic {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: rgba(255, 255, 255, 0.14);
      transition: transform .12s ease, background .12s ease;
    }
    .app:active .ic {
      transform: scale(.9);
      background: rgba(255, 255, 255, 0.28);
    }
    .app .lbl {
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.1;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
    .app.soon {
      opacity: .45;
    }
    .chip {
      position: absolute;
      bottom: 10px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: opacity .2s ease, transform .2s ease;
    }
    .chip.hidden {
      opacity: 0;
      transform: scale(.6);
      pointer-events: none;
    }
    .toast {
      position: fixed;
      bottom: 128px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(20, 20, 24, 0.85);
      padding: 8px 16px;
      border-radius: 18px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="tray" id="tray" role="toolbar" aria-label="5G New Calling">
    <button class="handle" onclick="setOpen(false)" aria-label="Thu gọn"></button>
    <div class="row">
      <button class="app" onclick="launchApp('sketch-sync-app')"><span class="ic">🎨</span><span class="lbl">Vẽ</span></button>
      <button class="app" onclick="launchApp('photo-share')"><span class="ic">📲</span><span class="lbl">Chia sẻ</span></button>
      <button class="app" onclick="launchApp('caro')"><span class="ic">♟️</span><span class="lbl">Caro</span></button>
    </div>
  </div>
  <button class="chip hidden" id="chip" onclick="setOpen(true)" aria-label="Mở ứng dụng">✨</button>

  <div id="toast" class="toast"></div>

  <script>
    function launchApp(appId) {
      if (window.AndroidBridge && window.AndroidBridge.startMiniApp) {
        window.AndroidBridge.startMiniApp(appId);
      } else {
        showToast("Không tìm thấy kết nối AndroidBridge!");
      }
    }

    function setOpen(open) {
      document.getElementById('tray').classList.toggle('hidden', !open);
      document.getElementById('chip').classList.toggle('hidden', open);
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
