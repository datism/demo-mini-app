<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Photo & Video Share — 5G New Calling</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117;
               font-family: 'Segoe UI', Roboto, sans-serif; color: #e6edf3; }

  /* ── Header ── */
  #header { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 30;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 14px; background: rgba(13,17,23,0.92); border-bottom: 1px solid #21262d; }
  #header .title { font-size: 15px; font-weight: 600; }
  #header .status { font-size: 11px; color: #8b949e; }
  #btnPick { background: #238636; color: #fff; border: none; border-radius: 16px;
             padding: 6px 14px; font-size: 13px; font-weight: 600; }

  /* ── Viewer ── */
  #viewer { position: absolute; top: 44px; bottom: 96px; left: 0; right: 0;
            overflow: hidden; background: #010409; touch-action: none; }
  #imgCanvasWrap { position: absolute; top: 0; bottom: 0; left: 0; right: 0;
                   display: flex; align-items: center; justify-content: center; }
  /* Kích thước do sizeCanvas() tính (fit vào #viewer) — max-width/height % không hoạt động vì #stage co theo ảnh. */
  #photoImg, #sharedVideo { display: block; object-fit: contain; user-select: none;
              -webkit-user-drag: none; }
  #drawCanvas { position: absolute; left: 0; top: 0; touch-action: none; pointer-events: none; }
  #stage { flex: none; line-height: 0; }
  #sharedVideo { background: #010409; }
  #prev, #next { position:absolute; bottom:8px; z-index:10; border:0; border-radius:20px; padding:8px 14px; color:white; background:#30363d; }
  #prev { left:8px; } #next { right:8px; }

  /* ── Loading spinner ── */
  #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; display: none; z-index: 5; }
  #loader .spin { width: 42px; height: 42px; border: 4px solid #30363d;
                  border-top-color: #58a6ff; border-radius: 50%; margin: 0 auto 10px;
                  animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .pct { font-size: 12px; color: #8b949e; }

  /* ── Empty state ── */
  #empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
           text-align: center; color: #484f58; }
  #empty .icon { font-size: 52px; margin-bottom: 10px; }
  #empty .txt { font-size: 14px; }

  /* ── Toolbar vẽ ── */
  #drawBar { position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
             display: none; flex-direction: column; gap: 10px; z-index: 25; }
  #drawBar button { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #30363d;
                    background: #161b22; font-size: 16px; color: #e6edf3; }
  #drawBar button.active { border-color: #58a6ff; background: #1f3a56; }
  #drawBar .swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #30363d; }
  #drawBar .swatch.active { border-color: #fff; transform: scale(1.12); }

  /* ── Thumbnail strip ── */
  #strip { position: fixed; bottom: 0; left: 0; right: 0; height: 96px; z-index: 30;
           display: flex; gap: 6px; padding: 8px; overflow-x: auto;
           background: rgba(13,17,23,0.95); border-top: 1px solid #21262d; }
  #strip .thumb { flex: 0 0 auto; width: 78px; height: 78px; border-radius: 8px;
                  border: 2px solid #30363d; object-fit: cover; background: #161b22; }
  #strip .thumb.active { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.4); }

  /* ── Hint toast ── */
  #toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
           background: rgba(30,35,42,0.96); color: #e6edf3;
           padding: 8px 16px; border-radius: 18px; font-size: 12px; z-index: 40;
           border: 1px solid #30363d; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="title">📷 Ảnh & video</div>
    <div class="status" id="statusText">Đang kết nối...</div>
  </div>
  <button id="btnPick">＋ Chọn ảnh / video</button>
</div>

<div id="viewer">
  <div id="imgCanvasWrap">
    <div style="position:relative; display:inline-block;" id="stage">
      <img id="photoImg" alt="" style="display:none">
      <video id="sharedVideo" controls playsinline muted preload="metadata" style="display:none"></video>
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>
  <div id="loader"><div class="spin"></div><div class="pct" id="loaderPct">0%</div></div>
  <div id="empty">
    <div class="icon">🖼️</div>
    <div class="txt">Chưa có ảnh / video — bấm “Chọn ảnh / video”<br>hoặc chờ đối phương chia sẻ</div>
  </div>
  <button id="prev" aria-label="Ảnh trước">‹</button>
  <button id="next" aria-label="Ảnh tiếp theo">›</button>
</div>

<div id="drawBar">
  <button id="btnDraw" title="Bút vẽ">✏️</button>
  <div class="swatch active" style="background:#ff3b30" data-color="#ff3b30"></div>
  <div class="swatch" style="background:#30d158" data-color="#30d158"></div>
  <div class="swatch" style="background:#0a84ff" data-color="#0a84ff"></div>
  <div class="swatch" style="background:#ffd60a" data-color="#ffd60a"></div>
  <button id="btnClearDraw" title="Xóa nét vẽ">🧹</button>
</div>

<div id="strip"></div>
<div id="toast"></div>

<input type="file" id="fileInput" accept="image/*,video/mp4,video/webm,video/3gpp" multiple style="display:none">

<script>
'use strict';

const $ = id => document.getElementById(id);
const MAX_MEDIA_BYTES = 50 * 1024 * 1024;
const actor = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2);
const state = { photos: {}, order: [], current: null, seq: 0, lastNavigation: [0, ''],
  pendingNavigation: null, drawMode: false, color: '#ff3b30', closed: false };
let mediaEpoch = 0, toastTimer, activeStroke = null;
const isVideo = p => !!p && String(p.mime || '').startsWith('video/');
const clamp = n => Math.max(0, Math.min(1, n));

function sendJson(message) {
  if (state.closed) return;
  const bridge = window.AndroidBridge;
  if (bridge && bridge.send) bridge.send(1000, JSON.stringify(message));
  else if (bridge && bridge.sendData) bridge.sendData(JSON.stringify(message));
}
function toast(text) {
  $('toast').textContent = text; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2400);
}
function setStatus(text) { $('statusText').textContent = text; }
function showLoader(visible) { $('loader').style.display = visible ? 'block' : 'none'; $('loaderPct').textContent = 'Đang nhận tệp…'; }
function renderStrip() {
  $('strip').replaceChildren();
  for (const id of state.order) {
    const p = state.photos[id], img = document.createElement('img');
    img.className = 'thumb' + (id === state.current ? ' active' : '');
    img.alt = isVideo(p) ? 'Video' : 'Ảnh';
    img.src = p.thumbUrl || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="78" height="78"><rect width="78" height="78" fill="#161b22"/><text x="39" y="49" font-size="30" text-anchor="middle" fill="white">' + (isVideo(p) ? '▶' : '▧') + '</text></svg>');
    img.onclick = () => gotoPhoto(id, true);
    $('strip').appendChild(img);
  }
}

// Layout uses the selected asset's dimensions, never the previous <img>'s natural size.
// CSS pixels and canvas backing pixels are kept separate on high-DPI phones.
function sizeCanvas() {
  const p = state.photos[state.current];
  if (!p || !(p.w > 0 && p.h > 0)) return;
  const viewer = $('viewer'), c = $('drawCanvas');
  const k = Math.min(viewer.clientWidth / p.w, viewer.clientHeight / p.h);
  const w = Math.max(1, Math.floor(p.w * k)), h = Math.max(1, Math.floor(p.h * k));
  $('stage').style.width = w + 'px'; $('stage').style.height = h + 'px';
  for (const el of [$('photoImg'), $('sharedVideo')]) { el.style.width = w + 'px'; el.style.height = h + 'px'; }
  const dpr = window.devicePixelRatio || 1;
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
  c.style.width = w + 'px'; c.style.height = h + 'px';
  c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawStrokes();
}
function updateDrawTools() {
  const p = state.photos[state.current], enabled = !!p && p.ready && !isVideo(p);
  $('drawBar').style.display = 'flex';
  $('btnDraw').disabled = !enabled;
  $('btnDraw').classList.toggle('active', state.drawMode && enabled);
  document.querySelectorAll('.swatch').forEach(el => el.style.display = state.drawMode && enabled ? 'block' : 'none');
  $('btnClearDraw').style.display = state.drawMode && enabled ? 'block' : 'none';
  $('drawCanvas').style.pointerEvents = state.drawMode && enabled ? 'auto' : 'none';
  $('drawCanvas').style.display = isVideo(p) ? 'none' : 'block';
}
function showPhoto(p) {
  if (!p || p.id !== state.current) return;
  const epoch = ++mediaEpoch, img = $('photoImg'), video = $('sharedVideo');
  video.pause(); video.removeAttribute('src'); video.load(); video.style.display = 'none';
  img.onload = null; img.onerror = null; img.style.display = 'none'; img.removeAttribute('src');
  $('empty').style.display = 'none';
  const full = p.ready && !!p.url;
  showLoader(!full); updateDrawTools(); sizeCanvas();
  if (isVideo(p) && full) {
    video.onloadedmetadata = () => {
      if (epoch !== mediaEpoch || state.current !== p.id) return;
      if (video.videoWidth && video.videoHeight) { p.w = video.videoWidth; p.h = video.videoHeight; }
      sizeCanvas();
    };
    video.onerror = () => { if (epoch === mediaEpoch) toast('Không phát được định dạng video này'); };
    video.muted = true; // Shared clips must not take the voice call's audio focus.
    video.src = p.url; video.style.display = 'block';
  } else {
    const url = full ? p.url : p.thumbUrl;
    if (url) {
      img.onload = () => {
        if (epoch !== mediaEpoch || state.current !== p.id) return;
        if (full || !(p.w > 0 && p.h > 0)) { p.w = img.naturalWidth; p.h = img.naturalHeight; }
        sizeCanvas();
      };
      img.onerror = () => { if (epoch === mediaEpoch) toast('Không đọc được ảnh'); };
      img.src = url; img.style.display = 'block';
    }
  }
  redrawStrokes();
}
function drawStrokeOn(ctx, stroke, w, h) {
  if (!stroke.pts || !stroke.pts.length) return;
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth = stroke.nw ? stroke.nw * Math.min(w, h) : (stroke.w || 3);
  ctx.lineJoin = ctx.lineCap = 'round'; ctx.beginPath();
  stroke.pts.forEach((pt, i) => i ? ctx.lineTo(pt[0] * w, pt[1] * h) : ctx.moveTo(pt[0] * w, pt[1] * h));
  if (stroke.pts.length === 1) { const pt = stroke.pts[0]; ctx.lineTo(pt[0] * w + 0.01, pt[1] * h); }
  ctx.stroke();
}
function redrawStrokes() {
  const c = $('drawCanvas'), ctx = c.getContext('2d'), p = state.photos[state.current];
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore();
  if (!p || isVideo(p)) return;
  const r = c.getBoundingClientRect();
  p.strokes.forEach(st => drawStrokeOn(ctx, st, r.width, r.height));
  Object.values(p.live || {}).forEach(st => drawStrokeOn(ctx, st, r.width, r.height));
  if (activeStroke && activeStroke.id === p.id) drawStrokeOn(ctx, activeStroke, r.width, r.height);
}

function cancelStroke() {
  if (!activeStroke) return;
  sendJson({ t: 'ink-cancel', id: activeStroke.id, sid: activeStroke.sid });
  activeStroke = null; redrawStrokes();
}
function gotoPhoto(id, userInitiated) {
  const p = state.photos[id]; if (!p) return;
  cancelStroke(); state.current = id; renderStrip(); showPhoto(p);
  if (!p.ready) fetchPhoto(id);
  if (userInitiated) {
    const navigation = { t: 'goto', id, seq: ++state.seq, actor };
    state.lastNavigation = [navigation.seq, actor]; sendJson(navigation);
  }
}
function onRemoteGoto(msg) {
  const seq = Number(msg.seq) || 0, sender = String(msg.actor || 'legacy');
  state.seq = Math.max(state.seq, seq);
  if (seq < state.lastNavigation[0] || (seq === state.lastNavigation[0] && sender <= state.lastNavigation[1])) return;
  state.lastNavigation = [seq, sender];
  if (!state.photos[msg.id]) { state.pendingNavigation = msg; return; }
  state.pendingNavigation = null; gotoPhoto(msg.id, false);
}
function fetchPhoto(id) {
  const p = state.photos[id]; if (!p || p.ready || p.fetching) return;
  p.fetching = true; sendJson({ t: 'fetch', id });
  // A failed/old peer cannot leave the UI permanently stuck in "fetching".
  clearTimeout(p.fetchTimer);
  p.fetchTimer = setTimeout(() => {
    if (state.closed || p.ready) return;
    p.fetching = false;
    if (state.current === id) { showLoader(false); toast('Chưa nhận được tệp. Chọn lại để thử.'); }
  }, 180000);
}
function onOffer(msg) {
  const photos = Array.isArray(msg.photos) ? msg.photos : [];
  for (const ph of photos) {
    if (!/^[A-Za-z0-9_-]{1,96}$/.test(ph.id) || state.photos[ph.id] || ph.bytes > MAX_MEDIA_BYTES) continue;
    const thumbUrl = ph.thumb ? (ph.thumb.startsWith('data:') ? ph.thumb : 'data:image/jpeg;base64,' + ph.thumb) : '';
    state.photos[ph.id] = { id: ph.id, mime: ph.mime || 'image/jpeg', w: ph.w || 0, h: ph.h || 0,
      bytes: ph.bytes, thumbUrl, ready: false, fetching: false, strokes: [], live: {} };
    state.order.push(ph.id);
  }
  renderStrip();
  if (state.pendingNavigation && state.photos[state.pendingNavigation.id]) {
    const id = state.pendingNavigation.id; state.pendingNavigation = null; gotoPhoto(id, false);
  } else if (!state.current && photos.length && state.photos[photos[0].id]) gotoPhoto(photos[0].id, false);
}
function onStored(msg) {
  const p = state.photos[msg.id]; if (!p) return;
  if (p.url && p.url.startsWith('blob:')) URL.revokeObjectURL(p.url);
  Object.assign(p, { url: msg.url, mime: msg.mime || p.mime, w: msg.w || p.w, h: msg.h || p.h, ready: true, fetching: false });
  clearTimeout(p.fetchTimer);
  if (state.current === p.id) showPhoto(p);
  sendJson({ t: 'done', id: p.id, ok: true }); setStatus('Đã nhận tệp');
}
// Compatibility with older photo-only peers. Full images are retained when navigating away and back.
function onPshare(hash, b64) {
  const id = Object.keys(state.photos).find(k => hash16(k) === Number(hash)); if (!id) return;
  const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  onStored({ id, mime: 'image/jpeg', url: URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })) });
}
function hash16(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h & 0xffff; }
function onFetch(msg) {
  const p = state.photos[msg.id], bridge = window.AndroidBridge;
  if (!p || !p.local || !bridge || !bridge.sendPhoto) return;
  const res = JSON.parse(bridge.sendPhoto(JSON.stringify({ id: p.id })));
  if (!res.ok) sendJson({ t: 'transfer-error', id: p.id });
  // Native sends begin on the SAME ordered channel before any binary frames.
}

$('btnPick').onclick = () => {
  if (window.AndroidBridge && window.AndroidBridge.pickMedia) window.AndroidBridge.pickMedia();
  else $('fileInput').click();
};
window.onNativeMediaImported = function(assets) {
  if (state.closed || !Array.isArray(assets)) return;
  const offer = [];
  for (const asset of assets) {
    if (!asset.id || !asset.url) continue;
    const thumbUrl = asset.thumb ? 'data:image/jpeg;base64,' + asset.thumb : '';
    state.photos[asset.id] = Object.assign({}, asset, { local: true, ready: true, thumbUrl, strokes: [], live: {} });
    state.order.push(asset.id);
    offer.push({ id: asset.id, mime: asset.mime, w: asset.w, h: asset.h, bytes: asset.bytes, thumb: asset.thumb || '' });
  }
  if (offer.length) {
    sendJson({ t: 'offer', photos: offer }); // Announce IDs before the first synchronized navigation.
    gotoPhoto(offer[0].id, true); setStatus('Đã chia sẻ ' + offer.length + ' tệp');
  }
};
// Older APKs may still expose only importPhotoB64. Limit this fallback to small photos.
$('fileInput').onchange = async () => {
  const files = Array.from($('fileInput').files || []); $('fileInput').value = '';
  const bridge = window.AndroidBridge;
  if (!bridge || !bridge.importPhotoB64) { toast('Cần ứng dụng Android để chia sẻ tệp'); return; }
  const imported = [];
  for (const file of files) {
    if (!file.type.startsWith('image/') || file.size > 6 * 1024 * 1024) { toast('Cập nhật ứng dụng để chọn video hoặc ảnh lớn'); continue; }
    try {
      const bmp = await createImageBitmap(file), k = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement('canvas'); canvas.width = Math.round(bmp.width * k); canvas.height = Math.round(bmp.height * k);
      canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height); bmp.close();
      const b64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1], id = 'p_' + actor.replace(/[^A-Za-z0-9]/g, '') + '_' + Date.now();
      const res = JSON.parse(bridge.importPhotoB64(JSON.stringify({ id, data: b64 })));
      if (res.ok) imported.push({ id, mime: 'image/jpeg', w: canvas.width, h: canvas.height, bytes: res.bytes,
        url: bridge.mediaUrl(id, false), thumb: '' });
    } catch (e) { toast('Không đọc được ảnh'); }
  }
  window.onNativeMediaImported(imported);
};

$('btnDraw').onclick = () => { cancelStroke(); state.drawMode = !state.drawMode; updateDrawTools(); };
document.querySelectorAll('.swatch').forEach(sw => sw.onclick = () => {
  state.color = sw.dataset.color;
  document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('active', x === sw));
});
$('btnClearDraw').onclick = () => {
  const p = state.photos[state.current]; if (!p) return;
  cancelStroke(); p.strokes = []; p.live = {}; redrawStrokes(); sendJson({ t: 'clear', id: p.id });
};
function normalizedPoint(e) {
  const r = $('drawCanvas').getBoundingClientRect();
  return [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)];
}
function emitInk(stroke) {
  const pts = stroke.pts.slice(Math.max(0, stroke.sent - 1)); stroke.sent = stroke.pts.length; stroke.lastSent = Date.now();
  sendJson({ t: 'ink', id: stroke.id, sid: stroke.sid, color: stroke.color, nw: stroke.nw, pts });
}
$('drawCanvas').addEventListener('pointerdown', e => {
  const p = state.photos[state.current]; if (!state.drawMode || !p || !p.ready || isVideo(p)) return;
  e.preventDefault();
  activeStroke = { id: p.id, sid: actor + ':' + Date.now(), pointerId: e.pointerId,
    color: state.color, nw: 0.008, pts: [normalizedPoint(e)], sent: 0, lastSent: 0 };
  $('drawCanvas').setPointerCapture(e.pointerId); emitInk(activeStroke); redrawStrokes();
});
$('drawCanvas').addEventListener('pointermove', e => {
  if (!activeStroke || activeStroke.pointerId !== e.pointerId) return;
  activeStroke.pts.push(normalizedPoint(e));
  if (activeStroke.pts.length >= 1024) finishStroke(e);
  else { if (Date.now() - activeStroke.lastSent >= 50) emitInk(activeStroke); redrawStrokes(); }
});
function finishStroke(e) {
  const st = activeStroke; if (!st || st.pointerId !== e.pointerId) return;
  const p = state.photos[st.id]; activeStroke = null;
  if (p) { p.strokes.push(st); sendJson({ t: 'stroke', id: st.id, sid: st.sid, color: st.color, nw: st.nw, pts: st.pts }); }
  redrawStrokes();
}
$('drawCanvas').addEventListener('pointerup', finishStroke);
$('drawCanvas').addEventListener('pointercancel', cancelStroke);
$('drawCanvas').addEventListener('lostpointercapture', cancelStroke);
function validStroke(msg) {
  return Array.isArray(msg.pts) && msg.pts.length > 0 && msg.pts.length <= 1024 &&
    msg.pts.every(pt => Array.isArray(pt) && pt.length === 2 && pt.every(n => Number.isFinite(n) && n >= 0 && n <= 1));
}
function onRemoteStroke(msg, live) {
  const p = state.photos[msg.id]; if (!p || !validStroke(msg) || isVideo(p)) return;
  const stroke = { sid: msg.sid, color: /^#[0-9a-f]{6}$/i.test(msg.color) ? msg.color : '#ff3b30',
    nw: Number.isFinite(msg.nw) ? Math.max(0.001, Math.min(0.05, msg.nw)) : undefined, w: 3, pts: msg.pts };
  if (live) {
    if (!msg.sid) return;
    if (!p.live[msg.sid]) p.live[msg.sid] = Object.assign({}, stroke, { pts: [] });
    p.live[msg.sid].pts = p.live[msg.sid].pts.concat(msg.pts).slice(-1024);
  } else {
    if (msg.sid) delete p.live[msg.sid];
    if (!msg.sid || !p.strokes.some(st => st.sid === msg.sid)) p.strokes.push(stroke);
  }
  if (state.current === p.id) redrawStrokes();
}
function navigate(delta) {
  const next = state.order.indexOf(state.current) + delta;
  if (next >= 0 && next < state.order.length) gotoPhoto(state.order[next], true);
}
$('prev').onclick = () => navigate(-1); $('next').onclick = () => navigate(1);
let swipe = null;
$('viewer').addEventListener('pointerdown', e => {
  if (e.target === $('sharedVideo') || (e.target === $('drawCanvas') && state.drawMode)) return;
  swipe = { x: e.clientX, y: e.clientY, time: Date.now(), id: e.pointerId };
});
$('viewer').addEventListener('pointerup', e => {
  const start = swipe; swipe = null; if (!start || e.pointerId !== start.id) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.abs(dx) >= 60 && Math.abs(dy) < 50 && Date.now() - start.time < 700) navigate(dx < 0 ? 1 : -1);
});
$('viewer').addEventListener('pointercancel', () => { swipe = null; });

window.receiveData = function(data) {
  if (state.closed) return;
  try {
    if (typeof data === 'string' && data.startsWith('PSHARE:')) {
      const parts = data.split(':'); onPshare(parts[1], parts.slice(2).join(':')); return;
    }
    const msg = typeof data === 'string' ? JSON.parse(data) : data;
    if (!msg) return;
    switch (msg.t) {
      case 'offer': onOffer(msg); break;
      case 'fetch': onFetch(msg); break;
      case 'begin': {
        const p = state.photos[msg.id]; if (p) { p.mime = msg.mime || p.mime; p.w = msg.w || p.w; p.h = msg.h || p.h; }
        break;
      }
      case 'stored': onStored(msg); break;
      case 'done': setStatus('Đã gửi xong'); break;
      case 'goto': onRemoteGoto(msg); break;
      case 'ink': onRemoteStroke(msg, true); break;
      case 'stroke': onRemoteStroke(msg, false); break;
      case 'ink-cancel': { const p = state.photos[msg.id]; if (p) { delete p.live[msg.sid]; redrawStrokes(); } break; }
      case 'clear': {
        const p = state.photos[msg.id]; if (p) { if (activeStroke && activeStroke.id === p.id) cancelStroke(); p.strokes = []; p.live = {}; redrawStrokes(); }
        break;
      }
      case 'transfer-error': {
        const p = state.photos[msg.id]; if (p) { p.fetching = false; clearTimeout(p.fetchTimer); }
        if (state.current === msg.id) { showLoader(false); toast('Gửi tệp thất bại. Chọn lại để thử.'); }
        break;
      }
    }
  } catch (e) { console.warn('[PhotoShare] Invalid message', e); }
};
window.addEventListener('load', () => {
  setStatus('Sẵn sàng'); updateDrawTools();
  if (window.ImsDcBridge && window.ImsDcBridge.createDataChannel) window.ImsDcBridge.createDataChannel('photo-share');
});
window.addEventListener('resize', sizeCanvas);
if (window.ResizeObserver) new ResizeObserver(sizeCanvas).observe($('viewer'));
window.cleanUpImsDcObjects = function() {
  state.closed = true; activeStroke = null; mediaEpoch++;
  $('sharedVideo').pause(); $('sharedVideo').removeAttribute('src'); $('sharedVideo').load();
  Object.values(state.photos).forEach(p => { clearTimeout(p.fetchTimer); if (p.url && p.url.startsWith('blob:')) URL.revokeObjectURL(p.url); });
  clearTimeout(toastTimer); state.photos = {}; state.order = []; state.current = null;
};
</script>
