<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bảng vẽ — 5G New Calling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
                 font-family: 'Segoe UI', Roboto, sans-serif; }

    /* Nền trong suốt — video cuộc gọi hiện xuyên qua phần không có ảnh nền. */
    #board { position: absolute; inset: 0; display: block; touch-action: none; }

    /* ── Top status pill: tên app + peer presence ── */
    #topBar { position: fixed; top: 10px; left: 0; right: 0; z-index: 30;
              display: flex; justify-content: center; pointer-events: none; }
    #topBar .title { display: flex; align-items: center; gap: 7px; padding: 7px 16px;
                     border-radius: 16px; font-size: 12px; color: #fff;
                     background: rgba(20,20,24,0.55); backdrop-filter: blur(14px);
                     -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.12); }
    #peerDot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35);
               transition: background .2s, box-shadow .2s; }
    #peerDot.live { background: #30d158; box-shadow: 0 0 6px #30d158; }
    #peerLbl { color: rgba(255,255,255,0.75); }

    /* ── Bottom control pill (ngôn ngữ chung với tray caro + điều khiển cuộc gọi) ── */
    #pill { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40;
            display: flex; align-items: center; gap: 4px; padding: 8px 10px;
            max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none;
            border-radius: 26px; background: rgba(20,20,24,0.62);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.14); white-space: nowrap;
            transition: opacity .25s, transform .25s; }
    #pill::-webkit-scrollbar { display: none; }
    #pill.hidden { opacity: 0; transform: translateX(-50%) scale(.7); pointer-events: none; }

    #pill button.tool { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%;
                        border: none; background: rgba(255,255,255,0.1);
                        font-size: 19px; color: #fff; touch-action: manipulation; }
    #pill button.tool:active { transform: scale(.9); }
    #pill button.tool.active { background: #1f3a56; box-shadow: 0 0 0 2px #58a6ff; }
    #pill button.tool[disabled] { opacity: .3; }

    .sep { width: 1px; height: 26px; flex: 0 0 1px; margin: 0 3px;
           background: rgba(255,255,255,0.15); }

    #widths { display: flex; align-items: center; gap: 4px; }
    #widths .w { width: 34px; height: 42px; flex: 0 0 34px; border-radius: 12px; border: none;
                 background: transparent; display: flex; align-items: center; justify-content: center; }
    #widths .w.active { background: rgba(255,255,255,0.16); }
    #widths .w i { border-radius: 50%; background: #fff; display: block; }

    #colors { display: flex; align-items: center; gap: 5px; }
    #colors .c { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
                 border: 2px solid rgba(255,255,255,0.35); }
    #colors .c.active { border-color: #fff; transform: scale(1.14); }

    /* Chip mở lại pill khi đang vẽ */
    #chip { position: fixed; bottom: 20px; right: 18px; z-index: 39; width: 46px; height: 46px;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.16);
            background: rgba(20,20,24,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            font-size: 21px; color: #fff; transition: opacity .2s, transform .2s; }
    #chip.hidden { opacity: 0; transform: scale(.6); pointer-events: none; }

    #toast { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); z-index: 50;
             padding: 8px 16px; border-radius: 18px; font-size: 12px; color: #fff;
             background: rgba(30,35,42,0.92); border: 1px solid rgba(255,255,255,0.15);
             opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; }
    #toast.show { opacity: 1; }

    /* Ack progress — không có % thật theo từng chunk nên dùng dạng hoạt ảnh -> xong là ẩn */
    #progress { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); z-index: 50;
                display: none; align-items: center; gap: 8px; padding: 6px 14px;
                border-radius: 14px; background: rgba(20,20,24,0.85); color: #fff; font-size: 12px; }
    #progress.on { display: flex; }
    #progress .bar { width: 90px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); overflow: hidden; }
    #progress .bar i { display: block; height: 100%; width: 30%; border-radius: 2px;
                       background: #58a6ff; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }

    input[type=file] { display: none; }

    #zoomHint { position: fixed; top: 44px; right: 14px; z-index: 35; padding: 5px 10px;
                border-radius: 10px; font-size: 10.5px; color: #fff;
                background: rgba(20,20,24,0.7); display: none; }
  </style>
</head>
<body>

<canvas id="board"></canvas>

<div id="topBar"><div class="title"><span id="peerDot"></span><span>🎨 Bảng vẽ</span><span id="peerLbl"></span></div></div>

<div id="pill">
  <button class="tool active" id="btnPen" title="Bút vẽ">✏️</button>
  <button class="tool" id="btnEraser" title="Tẩy nét (chạm vào nét muốn xóa)">🧽</button>
  <div class="sep"></div>
  <div id="widths">
    <button class="w" data-w="2" title="Nét mảnh"><i style="width:4px;height:4px"></i></button>
    <button class="w active" data-w="4" title="Nét vừa"><i style="width:7px;height:7px"></i></button>
    <button class="w" data-w="9" title="Nét đậm"><i style="width:12px;height:12px"></i></button>
  </div>
  <div class="sep"></div>
  <div id="colors">
    <div class="c active" style="background:#ff3b30" data-color="#ff3b30"></div>
    <div class="c" style="background:#30d158" data-color="#30d158"></div>
    <div class="c" style="background:#0a84ff" data-color="#0a84ff"></div>
    <div class="c" style="background:#ffd60a" data-color="#ffd60a"></div>
    <div class="c" style="background:#ffffff; border-color:#999" data-color="#ffffff"></div>
    <div class="c" style="background:#1c1c1e" data-color="#1c1c1e"></div>
  </div>
  <div class="sep"></div>
  <button class="tool" id="btnUndo" title="Hoàn tác (nét của mình / thao tác xóa vừa rồi)">↶</button>
  <button class="tool" id="btnPhoto" title="Chèn ảnh nền">🖼️</button>
  <button class="tool" id="btnClear" title="Xóa hết nét — giữ để bỏ ảnh nền">🧹</button>
  <button class="tool" id="btnSave" title="Lưu bảng vẽ vào Thư viện ảnh">💾</button>
</div>
<button id="chip" class="hidden" aria-label="Mở thanh công cụ">🎨</button>

<div id="toast"></div>
<div id="progress"><div class="bar"><i></i></div><span id="progressLbl">Đang truyền</span></div>
<div id="zoomHint">chạm 2 lần để đặt lại thu phóng</div>

<input type="file" id="fileInput" accept="image/*">

<script>
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════
   * BẢNG VẼ (sketch-sync-app v2.1) — vẽ tự do 2 chiều + ảnh nền + undo/tẩy.
   *
   * Wire protocol trên ADC stream 1000 (P2P relay qua MF, 2 lớp):
   *   A. JSON control — qua AndroidBridge.send(1000, s):
   *      {t:"photo",  id, bytes, thumb}   — thông báo ảnh nền mới (thumb = base64)
   *      {t:"fetch",  id}                 — máy kia xin ảnh full
   *      {t:"begin",  id, chunks, bytes}  — bắt đầu chuỗi binary chunks
   *      {t:"done",   id, ok}             — xác nhận nhận đủ
   *      {t:"stroke", id, color, w, pts}  — nét mới (id = strokeId duy nhất)
   *      {t:"erase",  id}                 — xóa 1 nét theo id (tẩy / undo từ xa)
   *      {t:"clear",  backup}             — xóa hết nét; backup = mảng nét cũ
   *      {t:"photo.clear", backup}        — bỏ ảnh nền; backup = {id} để undo
   *          → backup:null ở cả 2 lệnh trên nghĩa là "HOÀN TÁC clear vừa rồi"
   *      {t:"ping"} / {t:"pong"}          — heartbeat presence
   *   B. Binary chunk — native PhotoTransport tự ghép (byte đầu 0x01), khi đủ
   *      đẩy lên JS: window.receiveData("PSHARE:<idHash>:<b64>")
   *
   * Hoàn tác (undo):
   *   - Không có clear nào: xóa nét CỦA MÌNH gần nhất ({t:"erase"}).
   *   - Clear gửi KÈM backup; cả 2 máy giữ backup. Ai bấm ↶ trước thì gửi
   *     backup:null, cả 2 khôi phục lại TRỌN vẹn (mine flag gốc giữ nguyên →
   *     undo tiếp theo của mỗi máy vẫn đúng tác giả).
   *
   * Tương thích legacy (debug broadcast của CallActivity + uesim):
   *   {type:"draw", fromX, fromY, toX, toY, color, size} — tọa độ tuyệt đối
   *   chuẩn hóa về [0,1] theo khung 1000x1000 gốc; {type:"clear"} (không undo).
   * ═══════════════════════════════════════════════════════════════════ */

  const $ = id => document.getElementById(id);
  const state = {
    color: '#ff3b30',
    penW: 4,
    mode: 'pen',                    // 'pen' | 'eraser'
    photo: null,                    // {id, url, img, ready}
    strokes: [],                    // {id, mine, color, w, pts:[[x,y]..]}
    pendingPhoto: null,             // ảnh đang chờ fetch từ xa
    lastBackup: null,               // {kind:'strokes',strokes:[..]} | {kind:'photo',photo:{..}}
    peerActiveAt: 0,                // presence: thời điểm msg cuối từ đối phương
  };
  let seq = 0;
  const newId = () => 's' + Date.now().toString(36) + (seq++).toString(36);
  const myStrokes = () => state.strokes.filter(s => s.mine);

  /* ─────────────── Bridge helpers ─────────────── */
  function sendJson(obj) {
    const s = JSON.stringify(obj);
    if (window.AndroidBridge && window.AndroidBridge.send) {
      window.AndroidBridge.send(1000, s);
    } else if (window.AndroidBridge && window.AndroidBridge.sendData) {
      window.AndroidBridge.sendData(s);
    } else { console.warn('[SK] no bridge', s); }
  }

  /* ─────────────── Toast / progress / haptic ─────────────── */
  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
  }
  function showProgress(label) { $('progressLbl').textContent = label || 'Đang truyền'; $('progress').classList.add('on'); }
  function hideProgress() { $('progress').classList.remove('on'); }
  /** Rung nhẹ xác nhận thao tác (WebView hỗ trợ navigator.vibrate — caro dùng cùng cơ chế). */
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern || 8); } catch (e) {}
  }

  /* ═══════════════ CANVAS & VẼ ═══════════════ */
  const board = $('board');
  const ctx = board.getContext('2d');

  /* Ảnh nền: khung contain-fit CƠ SỞ là hệ quy chiếu chung của 2 máy;
     zoom/pan là GÓC NHÌN cục bộ của mỗi máy (không đồng bộ — nét vẫn lưu [0,1]). */
  let zoom = { k: 1, x: 0, y: 0 };

  function sizeBoard() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    board.width = Math.round(w * dpr);
    board.height = Math.round(h * dpr);
    board.style.width = w + 'px';
    board.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  /** Khung contain-fit lúc zoom=1 (hệ [0,1] của nét vẽ). */
  function baseRect() {
    const p = state.photo;
    if (!p || !p.img || !p.img.naturalWidth) return null;
    const k = Math.min(window.innerWidth / p.img.naturalWidth, window.innerHeight / p.img.naturalHeight);
    const w = p.img.naturalWidth * k, h = p.img.naturalHeight * k;
    return { x: (window.innerWidth - w) / 2, y: (window.innerHeight - h) / 2, width: w, height: h };
  }
  /** Khung hiện tại sau zoom/pan. */
  function viewRect() {
    const r = baseRect();
    if (!r) return null;
    return { x: r.x + zoom.x, y: r.y + zoom.y, width: r.width * zoom.k, height: r.height * zoom.k };
  }

  function redraw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    const r = viewRect();
    if (r && state.photo.img) ctx.drawImage(state.photo.img, r.x, r.y, r.width, r.height);
    state.strokes.forEach(st => renderStroke(ctx, st));
  }

  /** Vẽ 1 nét lên context bất kỳ (dùng cho cả màn hình và export).
   *  Làm mịn: đường bậc-2 qua trung điểm các đoạn thay vì polyline gãy. */
  function renderStroke(c, st, extra) {
    if (!st.pts || !st.pts.length) return;
    const r = viewRect();
    const fx = r ? r.x : 0, fy = r ? r.y : 0;
    const fw = r ? r.width : window.innerWidth, fh = r ? r.height : window.innerHeight;
    const pts = extra ? st.pts.concat([extra]) : st.pts;
    const X = p => fx + p[0] * fw, Y = p => fy + p[1] * fh;
    c.strokeStyle = st.color; c.lineWidth = st.w || 4;
    c.lineJoin = c.lineCap = 'round';
    if (pts.length === 1) {
      c.beginPath(); c.arc(X(pts[0]), Y(pts[0]), (st.w || 4) / 2, 0, Math.PI * 2);
      c.fillStyle = st.color; c.fill();
      return;
    }
    c.beginPath();
    c.moveTo(X(pts[0]), Y(pts[0]));
    if (pts.length === 2) {
      c.lineTo(X(pts[1]), Y(pts[1]));
    } else {
      for (let i = 1; i < pts.length - 1; i++) {
        c.quadraticCurveTo(X(pts[i]), Y(pts[i]), (X(pts[i]) + X(pts[i + 1])) / 2, (Y(pts[i]) + Y(pts[i + 1])) / 2);
      }
      c.lineTo(X(pts[pts.length - 1]), Y(pts[pts.length - 1]));
    }
    c.stroke();
  }

  /** screen → [0,1] trong khung ảnh (đảo cả zoom/pan để nét luôn đúng hệ chung). */
  function normPoint(cx, cy) {
    const r = viewRect();
    if (!r) return [cx / window.innerWidth, cy / window.innerHeight];
    return [Math.min(1.2, Math.max(-0.2, (cx - r.x) / r.width)),
            Math.min(1.2, Math.max(-0.2, (cy - r.y) / r.height))];
  }

  /* ═══════════════ CHẠM: 1 ngón vẽ/tẩy — 2 ngón zoom/pan — chạm đôi reset ═══════════════ */
  (function () {
    let stroking = null;
    const pointers = new Map();     // pointerId → {x, y}
    let gesture = null;             // {mid0:{x,y}, k0, x0, y0, dist0}
    let lastTap = 0;

    board.addEventListener('pointerdown', e => {
      e.preventDefault();
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { board.setPointerCapture(e.pointerId); } catch (_) {}

      if (pointers.size === 2 && state.photo) {
        stroking = null;            // ngón thứ 2 = rời chế độ vẽ, bắt đầu pinch
        const [a, b] = [...pointers.values()];
        gesture = {
          mid0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
          dist0: Math.hypot(a.x - b.x, a.y - b.y), k0: zoom.k, x0: zoom.x, y0: zoom.y,
        };
        return;
      }
      if (pointers.size > 1) return;

      const now = Date.now();
      if (now - lastTap < 300 && state.photo) {   // chạm đôi: reset góc nhìn
        zoom = { k: 1, x: 0, y: 0 };
        $('zoomHint').style.display = 'none';
        redraw();
        lastTap = 0;
        return;
      }
      lastTap = now;

      if (state.mode === 'eraser') return;        // tẩy chọn nét ở pointerup
      stroking = { id: newId(), mine: true, color: state.color, w: state.penW, pts: [normPoint(e.clientX, e.clientY)] };
    });

    board.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      // 2 ngón: zoom quanh điểm giữa + pan theo độ dời điểm giữa (một công thức duy nhất).
      if (gesture && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const br = baseRect();
        if (!br || gesture.dist0 < 10) return;
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        zoom.k = Math.min(6, Math.max(1, gesture.k0 * d / gesture.dist0));
        // Giữ điểm ảnh nằm dưới mid0 word đầu tiên nằm dưới mid hiện tại:
        // u = (mid0.x - (br.x + x0)) / k0  (theo biến ở phần trăm chiều rộng)
        zoom.x = mid.x - br.x - ((gesture.mid0.x - (br.x + gesture.x0)) / gesture.k0) * zoom.k;
        zoom.y = mid.y - br.y - ((gesture.mid0.y - (br.y + gesture.y0)) / gesture.k0) * zoom.k;
        $('zoomHint').style.display = zoom.k > 1.05 ? 'block' : 'none';
        redraw();
        return;
      }

      if (!stroking) return;
      const p = normPoint(e.clientX, e.clientY);
      const lastP = stroking.pts[stroking.pts.length - 1];
      if (Math.hypot(p[0] - lastP[0], p[1] - lastP[1]) < 0.004) return;  // bỏ điểm trùng — nét mượt, wire nhẹ
      stroking.pts.push(p);
      redraw();
      renderStroke(ctx, stroking);
    });

    function finish(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) gesture = null;

      if (state.mode === 'eraser' && !stroking) {
        const hit = hitStroke(e.clientX, e.clientY);
        if (hit) { removeStroke(hit.id, true); buzz(12); }
        return;
      }
      if (!stroking) return;
      if (stroking.pts.length) {
        state.strokes.push(stroking);
        sendJson({ t: 'stroke', id: stroking.id, color: stroking.color, w: stroking.w, pts: stroking.pts });
        buzz(6);
        collapsePill();
        updateToolbar();
      }
      stroking = null;
    }
    board.addEventListener('pointerup', finish);
    board.addEventListener('pointercancel', finish);
    board.addEventListener('lostpointercapture', finish);
  })();

  /** Hit-test nét gần vị trí chạm (khoảng cách tới đỉnh polyline, ngưỡng tính theo bút + ngón tay). */
  function hitStroke(cx, cy) {
    const r = viewRect();
    const fx = r ? r.x : 0, fy = r ? r.y : 0;
    const fw = r ? r.width : window.innerWidth, fh = r ? r.height : window.innerHeight;
    let best = null, bestD = Infinity;
    for (const st of state.strokes) {
      const thr = (st.w || 4) / 2 + 14;
      for (const p of st.pts) {
        const d = Math.hypot(cx - (fx + p[0] * fw), cy - (fy + p[1] * fh));
        if (d < thr && d < bestD) { best = st; bestD = d; }
      }
    }
    return best;
  }

  function removeStroke(id, sync) {
    const i = state.strokes.findIndex(s => s.id === id);
    if (i < 0) return;
    state.strokes.splice(i, 1);
    redraw();
    if (sync) sendJson({ t: 'erase', id });
    updateToolbar();
  }

  /* ═══════════════ THANH CÔNG CỤ ═══════════════ */
  function updateToolbar() {
    $('btnUndo').disabled = myStrokes().length === 0 && !state.lastBackup;
  }

  function setTool(id) {
    ['btnPen', 'btnEraser'].forEach(x => $(x).classList.toggle('active', x === id));
  }
  $('btnPen').onclick = () => { state.mode = 'pen'; setTool('btnPen'); };
  $('btnEraser').onclick = () => { state.mode = 'eraser'; setTool('btnEraser'); toast('🧽 Chạm vào nét cần xóa'); };

  document.querySelectorAll('#widths .w').forEach(b => {
    b.onclick = () => {
      state.penW = Number(b.dataset.w);
      document.querySelectorAll('#widths .w').forEach(x => x.classList.toggle('active', x === b));
      state.mode = 'pen'; setTool('btnPen');
    };
  });
  document.querySelectorAll('#colors .c').forEach(sw => {
    sw.onclick = () => {
      state.color = sw.dataset.color;
      document.querySelectorAll('#colors .c').forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
      state.mode = 'pen'; setTool('btnPen');
    };
  });

  /** ↶ Hoàn tác: nét của mình gần nhất; hết thì hoàn tác clear/photo-clear vừa rồi (cả 2 máy). */
  $('btnUndo').onclick = () => {
    const mine = myStrokes();
    if (mine.length) { removeStroke(mine[mine.length - 1].id, true); return; }
    const b = state.lastBackup;
    if (!b) return;
    state.lastBackup = null;
    if (b.kind === 'strokes') {
      state.strokes = b.strokes.map(s => ({ ...s }));
      sendJson({ t: 'clear', backup: null });
    } else {
      restorePhoto(b.photo);
      sendJson({ t: 'photo.clear', backup: null });
    }
    redraw(); updateToolbar();
    toast('Đã hoàn tác');
  };

  /* 🧹 Nhấn = xóa hết nét (backup để undo). GIỮ 550ms = bỏ ảnh nền. */
  let clearHold = null, clearArmed = false;
  $('btnClear').addEventListener('pointerdown', () => {
    clearArmed = false;                               // reset cờ mỗi lần chạm mới
    clearTimeout(clearHold);
    clearHold = setTimeout(doPhotoClear, 550);
  });
  $('btnClear').addEventListener('pointerup', () => clearTimeout(clearHold));
  $('btnClear').addEventListener('pointerleave', () => clearTimeout(clearHold));
  $('btnClear').onclick = () => { if (!clearArmed) doClear(); };

  function doClear() {
    if (!state.strokes.length) { toast('Không còn nét để xóa'); return; }
    const backup = state.strokes.map(s => ({ ...s }));
    state.lastBackup = { kind: 'strokes', strokes: backup };
    state.strokes = [];
    redraw(); updateToolbar();
    sendJson({ t: 'clear', backup: backup.map(s => ({ id: s.id, mine: s.mine, color: s.color, w: s.w, pts: s.pts })) });
    buzz([10, 40, 10]);
  }

  function doPhotoClear() {
    clearArmed = true;                                // chặn onclick nổ sau long-press
    if (!state.photo) return;
    // KHÔNG revoke blob URL — ancora cho undo khôi phục lại.
    state.lastBackup = { kind: 'photo', photo: { id: state.photo.id, url: state.photo.url } };
    state.photo = null; state.pendingPhoto = null;
    zoom = { k: 1, x: 0, y: 0 };
    redraw(); updateToolbar();
    sendJson({ t: 'photo.clear', backup: { id: state.lastBackup.photo.id } });
    toast('Đã bỏ ảnh nền — ↶ để hoàn tác');
    buzz(14);
  }

  /* ─────────────── Pill: thu gọn khi vẽ, hiện qua chip / idle ─────────────── */
  let pillIdle = null;
  function collapsePill() {
    $('pill').classList.add('hidden');
    $('chip').classList.remove('hidden');
    clearTimeout(pillIdle);
  }
  function expandPill() {
    $('pill').classList.remove('hidden');
    $('chip').classList.add('hidden');
    clearTimeout(pillIdle);
    pillIdle = setTimeout(() => { if (state.mode === 'pen') collapsePill(); }, 6000);
  }
  $('chip').onclick = expandPill;

  /* ═══════════════ CHÈN ẢNH NỀN ═══════════════ */
  $('btnPhoto').onclick = () => $('fileInput').click();

  function blobToB64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(r.error || new Error('read_failed'));
      r.readAsDataURL(blob);
    });
  }

  /** File ảnh → base64 JPEG cạnh dài 1920 (EXIF native áp lần nữa khi decode). */
  async function fileToJpegB64(file) {
    try {
      const bmp = await createImageBitmap(file);
      const MAX = 1920, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k));
      c.height = Math.max(1, Math.round(bmp.height * k));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
      if (blob) return await blobToB64(blob);
    } catch (e) { /* rơi xuống bản gốc */ }
    if (file.size > 6 * 1024 * 1024) throw new Error('ảnh quá lớn');
    return await blobToB64(file);
  }

  $('fileInput').onchange = async () => {
    const file = ($('fileInput').files || [])[0];
    $('fileInput').value = '';
    if (!file) return;
    if (!window.AndroidBridge || typeof window.AndroidBridge.importPhotoB64 !== 'function') {
      toast('Không tìm thấy AndroidBridge'); return;
    }
    toast('Đang xử lý ảnh...');
    let b64;
    try { b64 = await fileToJpegB64(file); }
    catch (e) { toast('Không đọc được ảnh: ' + (e && e.message || e)); return; }
    const id = 'p' + Date.now();
    let res;
    try {
      res = JSON.parse(window.AndroidBridge.importPhotoB64(JSON.stringify({ id: id, data: b64, type: 'image/jpeg' })) || '{}');
    } catch (e) { toast('Lỗi khi gửi ảnh sang Android: ' + (e && e.message || e)); return; }
    if (!res.ok) { toast('Không nhập được ảnh: ' + (res.error || '?')); return; }

    // Nét sẵn có giữ nguyên hệ [0,1] — sang khung ảnh mới chúng khớp vị trí TƯƠNG ĐỐI.
    if (state.strokes.length) toast('Nét cũ đã ghép theo khung ảnh mới');

    const url = window.AndroidBridge ? window.AndroidBridge.mediaUrl(id, false) : '';
    setPhotoState({ id: id, ready: true, url: url, img: null });
    showProgress('Đang gửi ảnh');
    const thumb = await thumbB64Of(id);
    sendJson({ t: 'photo', id: id, bytes: res.bytes, thumb: thumb });
  };

  /** Đọc thumbnail <id>_t.jpg từ photostore qua /media/ rồi trả base64 thuần. */
  async function thumbB64Of(id) {
    try {
      const url = window.AndroidBridge.mediaUrl(id, true);
      const resp = await fetch(url);
      if (!resp.ok) return '';
      const buf = new Uint8Array(await resp.arrayBuffer());
      let bin = '';
      for (let j = 0; j < buf.length; j += 0x8000) {
        bin += String.fromCharCode.apply(null, buf.subarray(j, j + 0x8000));
      }
      return btoa(bin);
    } catch (e) { return ''; }
  }

  /** Gán ảnh nền (local hay blob) — revoke blob cũ chỉ khi THAY THẾ (không phải khi clear). */
  function setPhotoState(p) {
    if (!p) { state.photo = null; redraw(); return; }
    if (state.photo && state.photo.url && state.photo.url.startsWith('blob:') &&
        state.photo.url !== p.url) {
      URL.revokeObjectURL(state.photo.url);
    }
    state.photo = p;
    if (!p.img) {
      p.img = new Image();
      p.img.onload = () => redraw();
    }
    if (p.url) p.img.src = p.url;
    zoom = { k: 1, x: 0, y: 0 };
    redraw();
  }

  /** Khôi phục ảnh từ backup undo — blob (nhận từ xa) hoặc /media/ (như của mình). */
  function restorePhoto(p) {
    if (!p) return;
    const url = p.url || (window.AndroidBridge ? window.AndroidBridge.mediaUrl(p.id, false) : '');
    setPhotoState({ id: p.id, ready: true, url: url, img: null });
  }

  /* ─────────────── Nhận photo từ xa ─────────────── */
  function onRemotePhoto(msg) {
    let thumbUrl = '';
    if (msg.thumb) thumbUrl = msg.thumb.startsWith('data:') ? msg.thumb : 'data:image/jpeg;base64,' + msg.thumb;
    state.pendingPhoto = { id: msg.id, bytes: msg.bytes };
    // Nền tạm = thumb trong lúc chờ full.
    setPhotoState({ id: msg.id, ready: false, url: thumbUrl, img: null });
    toast('📨 Đối phương chèn ảnh — đang nhận...');
    showProgress('Đang nhận ảnh');
    sendJson({ t: 'fetch', id: msg.id });
  }

  function onFetch(msg) {
    if (!state.photo || state.photo.id !== msg.id || !window.AndroidBridge) return;
    const res = JSON.parse(window.AndroidBridge.sendPhoto(JSON.stringify({ id: msg.id })) || '{}');
    if (res.ok) sendJson({ t: 'begin', id: msg.id, chunks: res.chunks, bytes: res.bytes });
  }

  /** Frame ảnh đã ghép xong phía native: "PSHARE:<idHash>:<b64>". */
  function onPshare(idHash, b64) {
    const pending = state.pendingPhoto;
    if (!pending || hash16(pending.id) !== Number(idHash)) {
      console.warn('[SK] unknown idHash', idHash);
      return;
    }
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    setPhotoState({ id: pending.id, ready: true, url: url, img: null });
    hideProgress();
    sendJson({ t: 'done', id: pending.id, ok: true });
    toast('🖼️ Đã nhận ảnh nền — chạm 2 ngón để phóng to');
    buzz([12, 30, 12]);
  }
  function hash16(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return h & 0xffff; }

  /* ═══════════════ PRESENCE ═══════════════ */
  setInterval(() => {
    const live = Date.now() - state.peerActiveAt < 3000;
    $('peerDot').classList.toggle('live', live);
    $('peerLbl').textContent = live ? ' · đối phương đang vẽ' : '';
    if (live) sendJson({ t: 'ping' });
  }, 1500);

  /* ═══════════════ LƯU BẢNG VẼ (photo + nét composite) ═══════════════ */
  $('btnSave').onclick = () => {
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const c = document.createElement('canvas');
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    const oc = c.getContext('2d');
    oc.setTransform(dpr, 0, 0, dpr, 0, 0);
    oc.fillStyle = '#0d1117';
    oc.fillRect(0, 0, w, h);
    const r = viewRect();
    if (r && state.photo.img) oc.drawImage(state.photo.img, r.x, r.y, r.width, r.height);
    state.strokes.forEach(st => renderStroke(oc, st));

    const dataUrl = c.toDataURL('image/jpeg', 0.9);
    if (window.AndroidBridge && typeof window.AndroidBridge.saveCanvasToGallery === 'function') {
      const res = JSON.parse(window.AndroidBridge.saveCanvasToGallery(JSON.stringify({ data: dataUrl.split(',')[1] })) || '{}');
      toast(res.ok ? '💾 Đã lưu vào Thư viện ảnh' : 'Lỗi lưu: ' + (res.error || '?'));
      buzz(10);
    } else {
      toast('Thiết bị chưa hỗ trợ lưu ảnh');
    }
  };

  /* ═══════════════ ĐIỂM VÀO DUY NHẤT: nhận message ═══════════════ */
  window.receiveData = function (dataStr) {
    state.peerActiveAt = Date.now();
    try {
      // 1) Binary photo frame đã ghép: "PSHARE:<idHash>:<b64>"
      if (typeof dataStr === 'string' && dataStr.startsWith('PSHARE:')) {
        const parts = dataStr.split(':');
        onPshare(parts[1], parts.slice(2).join(':'));
        return;
      }
      const msg = typeof dataStr === 'object' ? dataStr : JSON.parse(dataStr);

      // 2) Legacy: debug broadcast / uesim
      if (msg.type === 'draw') {
        const st = legacyStroke(msg);
        if (st) { state.strokes.push(st); redraw(); updateToolbar(); }
        return;
      }
      if (msg.type === 'clear') {
        state.photo = null; state.pendingPhoto = null; state.lastBackup = null;
        state.strokes = []; zoom = { k: 1, x: 0, y: 0 };
        redraw(); updateToolbar();
        return;
      }
      if (msg.action === 'LAUNCH_APP' || msg.service) return;   // lệnh app khác

      // 3) JSON control của Bảng vẽ
      switch (msg.t) {
        case 'photo': onRemotePhoto(msg); break;
        case 'fetch': onFetch(msg); break;
        case 'begin': showProgress('Đang nhận ảnh'); break;
        case 'done':
          hideProgress();
          if (msg.ok) toast('Đã gửi xong ảnh');
          break;

        case 'stroke':
          state.strokes.push({ id: msg.id || newId(), mine: false, color: msg.color, w: msg.w, pts: msg.pts });
          redraw(); updateToolbar();
          break;
        case 'erase': removeStroke(msg.id, false); break;

        case 'ping': sendJson({ t: 'pong' }); break;
        case 'pong': break;   // presence đã cap ở đầu hàm

        case 'clear':
          if (msg.backup === null) {
            // Đối phương hoàn tác clear → khôi phục TRỌN vẹn từ backup mình đang giữ
            // (mine flag gốc giữ nguyên để undo của mỗi máy vẫn đúng tác giả).
            if (state.lastBackup && state.lastBackup.kind === 'strokes') {
              state.strokes = state.lastBackup.strokes.map(s => ({ ...s }));
              redraw();
            }
            state.lastBackup = null;
          } else if (msg.backup) {
            state.lastBackup = { kind: 'strokes', strokes: msg.backup.map(s => ({ ...s })) };
            state.strokes = [];
            redraw();
          } else {
            state.strokes = []; redraw();
          }
          updateToolbar();
          break;

        case 'photo.clear':
          if (msg.backup === null) {
            if (state.lastBackup && state.lastBackup.kind === 'photo') {
              restorePhoto(state.lastBackup.photo);
            }
            state.lastBackup = null;
          } else if (state.photo) {
            // Không revoke blob — mình có thể cần cho undo chéo.
            state.lastBackup = { kind: 'photo', photo: { id: state.photo.id, url: state.photo.url } };
            state.photo = null; state.pendingPhoto = null;
            zoom = { k: 1, x: 0, y: 0 };
            redraw();
            toast('Đối phương đã bỏ ảnh nền');
          }
          updateToolbar();
          break;
      }
    } catch (err) {
      console.warn('[SK] bad message', err, dataStr && String(dataStr).slice(0, 80));
    }
  };

  /** {type:"draw", fromX..., toX...} (tọa độ gốc 250..900, khung 1000x1000) → stroke [0,1]. */
  function legacyStroke(m) {
    if (typeof m.fromX !== 'number' || typeof m.fromY !== 'number') return null;
    const n = v => Math.min(1, Math.max(0, v / 1000));
    return {
      id: newId(), mine: false,
      color: m.color || '#ff3b30',
      w: m.size ? Math.max(2, Math.round(m.size / 3)) : 4,
      pts: [[n(m.fromX), n(m.fromY)], [n(m.toX ?? m.fromX), n(m.toY ?? m.fromY)]],
    };
  }

  /* ─────────────── Bridge qua GSMA _dsbridge / lifecycle ─────────────── */
  window.addEventListener('load', () => {
    sizeBoard();
    expandPill();
    updateToolbar();
    // Yêu cầu ADC nếu chưa có (vào app bằng deep-link không qua operator-menu).
    if (window.ImsDcBridge && window.ImsDcBridge.createDataChannel) {
      window.ImsDcBridge.createDataChannel('sketch-sync-app');
    } else if (window._dsbridge) {
      try { window._dsbridge.call('createAppDataChannel', 'sketch-sync-app'); } catch (e) {}
    }
  });

  window.addEventListener('resize', sizeBoard);

  /* GSMA TS.66 — dọn blob URLs khi app bị đóng. */
  window.cleanUpImsDcObjects = function () {
    if (state.photo && state.photo.url && state.photo.url.startsWith('blob:')) URL.revokeObjectURL(state.photo.url);
    state.photo = null; state.pendingPhoto = null; state.strokes = []; state.lastBackup = null;
  };
</script>
</body>
</html>
