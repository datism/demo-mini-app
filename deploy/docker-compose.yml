version: '3.8'

services:
  pcscf:
    image: erlang-sip:local
    tty: true
    environment:
      - NODE_ROLE=pcscf
      - INTERFACE_NAME=eth0
      - POD_IP=pcscf
      - NODE_NAME=pcscf@pcscf
      - NODE_COOKIE=ims_dc_sip_cookie
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    networks:
      - lan

  icscf:
    image: erlang-sip:local
    tty: true
    environment:
      - NODE_ROLE=icscf
      - INTERFACE_NAME=eth0
      - POD_IP=icscf
      - NODE_NAME=icscf@icscf
      - NODE_COOKIE=ims_dc_sip_cookie
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  scscf:
    image: erlang-sip:local
    tty: true
    environment:
      - NODE_ROLE=scscf
      - INTERFACE_NAME=eth0
      - POD_IP=scscf
      - NODE_NAME=scscf@scscf
      - NODE_COOKIE=ims_dc_sip_cookie
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  ims-as:
    image: go-mf:local
    command: ["./ims-as"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    depends_on:
      - scscf
      - dcsf
      - mf
    networks:
      - lan

  dcsf:
    image: go-mf:local
    command: ["./dcsf"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  mf:
    image: go-mf:local
    command: ["./mf"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - PUBLIC_IP=192.168.0.182
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
      - ENABLE_HEP_SELF_LOGGING=true
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    ports:
      - "40000-40010:40000-40010/udp"
      - "8081:8081"
    networks:
      - lan

  dcar:
    image: go-mf:local
    command: ["./dcar"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  dcas:
    image: go-mf:local
    command: ["./dcas"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  pcf:
    image: go-mf:local
    command: ["./pcf"]
    tty: true
    environment:
      - INTERFACE_NAME=eth0
      - HEP_SERVER_HOST=heplify-server
      - HEP_SERVER_PORT=9060
    volumes:
      - ../config/sys_config.json:/app/config/sys_config.json
    networks:
      - lan

  clickhouse-server:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-qryn}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-demo}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-qryn}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - lan

  qryn:
    image: qxip/qryn:3.2.38
    container_name: qryn
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - CLICKHOUSE_SERVER=clickhouse-server
      - CLICKHOUSE_AUTH=${CLICKHOUSE_USER:-qryn}:${CLICKHOUSE_PASSWORD:-demo}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-qryn}
      - PORT=3100
      - SAMPLES_DAYS=${RETENTION_DAYS:-14}
      - LABELS_DAYS=${RETENTION_DAYS:-14}
    depends_on:
      - clickhouse-server
    networks:
      - lan

  db:
    image: postgres:14-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-homerSeven}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-homer7}
    ports:
      - "5432:5432"
    networks:
      - lan

  heplify-server:
    image: sipcapture/heplify-server:1.30
    container_name: heplify-server
    command: ["/root/heplify-server"]
    restart: unless-stopped
    ports:
      - "9060:9060/udp"
      - "9060:9060/tcp"
    environment:
      - HEPLIFYSERVER_HEPADDR=:9060
      - HEPLIFYSERVER_DBADDR=db:5432
      - HEPLIFYSERVER_DBDRIVER=postgres
      - HEPLIFYSERVER_DBUSER=${POSTGRES_USER:-postgres}
      - HEPLIFYSERVER_DBPASS=${POSTGRES_PASSWORD:-homerSeven}
      - HEPLIFYSERVER_DBSHEMA=homer7
      - HEPLIFYSERVER_DBDATATABLE=homer_data
      - HEPLIFYSERVER_LOKIURL=http://qryn:3100/loki/api/v1/push
      - HEPLIFYSERVER_LOGSTD=true
      - HEPLIFYSERVER_LOGLVL=debug
      - HEPLIFYSERVER_LOKITIMER=1
      - HEPLIFYSERVER_LOKIBULK=1
      - HEPLIFYSERVER_DBROTATE=true
      - HEPLIFYSERVER_DBROTASIZE=10
      - HEPLIFYSERVER_DBROTASTEP=1d
      - HEPLIFYSERVER_DBROTACLEAN=true
    depends_on:
      - qryn
      - db
    networks:
      - lan

  homer-app:
    image: sipcapture/homer-app:1.1.4
    container_name: homer-app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASS=${POSTGRES_PASSWORD:-homerSeven}
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-homer7}
    depends_on:
      - db
      - heplify-server
    networks:
      - lan

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./config/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    depends_on:
      - qryn
    networks:
      - lan

  pcap-exporter:
    image: go-mf:local
    container_name: pcap-exporter
    command: ["./pcap-exporter"]
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-qryn}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-demo}
    depends_on:
      - clickhouse-server
    networks:
      - lan

networks:
  lan:
    driver: bridge
