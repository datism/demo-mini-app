    namespace: demo-mini-app
roleRef:
  kind: Role
  name: postgres-pod
  apiGroup: rbac.authorization.k8s.io

---
# 1. Postgres DB HA (StatefulSet using Patroni)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: demo-mini-app
spec:
  serviceName: db-service
  replicas: 1
  selector:
    matchLabels:
      app: db
      cluster-name: db
  template:
    metadata:
      labels:
        app: db
        cluster-name: db
    spec:
      serviceAccountName: postgres-pod
      containers:
      - name: postgres
        image: postgres-patroni:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        - containerPort: 8008
          name: patroni
        env:
        - name: PATRONI_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
          value: "$(PATRONI_KUBERNETES_POD_IP):5432"
        - name: PATRONI_RESTAPI_CONNECT_ADDRESS
          value: "$(PATRONI_KUBERNETES_POD_IP):8008"
        - name: PATRONI_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATRONI_KUBERNETES_BYPASS_API_SERVICE
          value: "true"
        - name: PATRONI_KUBERNETES_USE_ENDPOINTS
          value: "true"
        - name: PATRONI_SCOPE
          value: "db"
        - name: PATRONI_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PATRONI_KUBERNETES_LABELS
          value: '{"app": "db", "cluster-name": "db"}'
        - name: PATRONI_SUPERUSER_PASSWORD
          value: "homerSeven"
        - name: PATRONI_REPLICATION_PASSWORD
          value: "replpassword"
        - name: PATRONI_LOG_LEVEL
          value: "DEBUG"
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard

---
# Headless service for Postgres routing
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: demo-mini-app
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
  - name: patroni
    port: 8008
  selector:
    app: db

---
# Primary service routing to Master (managed by Patroni)
