# 2. ClickHouse Server HA (StatefulSet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-server
  namespace: demo-mini-app
spec:
  serviceName: clickhouse-service
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse-server
  template:
    metadata:
      labels:
        app: clickhouse-server
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:23.3-alpine
        command:
        - sh
        - -c
        - |
          POD_NAME=$(hostname)
          echo "Checking for ClickHouse cluster mode..."
          if [ "$CLICKHOUSE_REPLICAS" -gt 1 ]; then
            echo "Cluster mode detected (replicas=$CLICKHOUSE_REPLICAS). Setting up ClickHouse Keeper and macros..."
            cp /config-templates/use-keeper.xml /etc/clickhouse-server/config.d/use-keeper.xml
            sed -i "s/DYNAMIC_REPLICA/$POD_NAME/g" /etc/clickhouse-server/config.d/use-keeper.xml
            
            # Calculate KEEPER server_id from hostname index (e.g. clickhouse-server-0 -> server_id 1)
            INDEX=${POD_NAME##*-}
            export SERVER_ID=$((INDEX + 1))
            echo "Enabling ClickHouse Keeper with SERVER_ID=$SERVER_ID..."
            cp /config-templates/keeper-server.xml /etc/clickhouse-server/config.d/keeper-server.xml
          else
            echo "Standalone mode detected (replicas=$CLICKHOUSE_REPLICAS). Skipping Keeper setup."
            rm -f /etc/clickhouse-server/config.d/use-keeper.xml /etc/clickhouse-server/config.d/keeper-server.xml
          fi
          
          echo "Launching ClickHouse Server..."
          exec /entrypoint.sh
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        - containerPort: 2181
          name: keeper
        env:
        - name: CLICKHOUSE_USER
          value: "qryn"
        - name: CLICKHOUSE_PASSWORD
          value: "demo"
        - name: CLICKHOUSE_DB
          value: "qryn"
        - name: CLICKHOUSE_REPLICAS
          value: "3"
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
        - name: clickhouse-config-volume
          mountPath: /config-templates
      volumes:
      - name: clickhouse-config-volume
        configMap:
          name: clickhouse-config
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
      storageClassName: standard

---
# Headless service for ClickHouse pod resolution
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-service
  namespace: demo-mini-app
spec:
