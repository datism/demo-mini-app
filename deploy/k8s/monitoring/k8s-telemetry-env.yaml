apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: demo-mini-app
data:
  use-keeper.xml: |
    <clickhouse>
        <zookeeper>
            <node>
                <host>clickhouse-server-0.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                <port>2181</port>
            </node>
            <node>
                <host>clickhouse-server-1.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                <port>2181</port>
            </node>
            <node>
                <host>clickhouse-server-2.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                <port>2181</port>
            </node>
        </zookeeper>
        <remote_servers>
            <qryn_cluster>
                <shard>
                    <internal_replication>true</internal_replication>
                    <replica>
                        <host>clickhouse-server-0.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                        <port>9000</port>
                    </replica>
                    <replica>
                        <host>clickhouse-server-1.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                        <port>9000</port>
                    </replica>
                    <replica>
                        <host>clickhouse-server-2.clickhouse-service.demo-mini-app.svc.cluster.local</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </qryn_cluster>
        </remote_servers>
        <macros>
            <cluster>qryn_cluster</cluster>
            <shard>1</shard>
            <replica>DYNAMIC_REPLICA</replica>
        </macros>
        <default_replica_path>/clickhouse/tables/{cluster}-{shard}/{database}/{table}</default_replica_path>
        <default_replica_name>{replica}</default_replica_name>
    </clickhouse>

  keeper-server.xml: |
    <clickhouse>
        <keeper_server>
            <tcp_port>2181</tcp_port>
            <server_id from_env="SERVER_ID"/>
            <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
            <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
            <coordination_settings>
                <operation_timeout_ms>10000</operation_timeout_ms>
                <session_timeout_ms>30000</session_timeout_ms>
            </coordination_settings>
            <raft_configuration>
                <server>
                    <id>1</id>
                    <hostname>clickhouse-server-0.clickhouse-service.demo-mini-app.svc.cluster.local</hostname>
                    <port>9234</port>
                </server>
                <server>
                    <id>2</id>
                    <hostname>clickhouse-server-1.clickhouse-service.demo-mini-app.svc.cluster.local</hostname>
                    <port>9234</port>
                </server>
                <server>
                    <id>3</id>
                    <hostname>clickhouse-server-2.clickhouse-service.demo-mini-app.svc.cluster.local</hostname>
                    <port>9234</port>
                </server>
            </raft_configuration>
        </keeper_server>
    </clickhouse>

