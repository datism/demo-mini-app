# 8. PCF (Policy Control Function)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf
  namespace: demo-mini-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pcf
      instance: pcf-1
  template:
    metadata:
      labels:
        app: pcf
        instance: pcf-1
    spec:
      containers:
      - name: pcf
        image: go-mf:local
        command: ["./pcf"]
        env:
        - name: INTERFACE_NAME
          value: eth0
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      initContainers:
      - name: register-dns
        image: python:3.10-slim
        command:
        - python
        - -c
        - |
          import socket, fcntl, struct, urllib.request, time
          def get_ip(ifname):
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  return socket.inet_ntoa(fcntl.ioctl(s.fileno(), 0x8915, struct.pack('256s', bytes(ifname[:15], 'utf-8')))[20:24])
              except IOError:
                  return None
          ip = None
          for _ in range(10):
              ip = get_ip('eth0')
              if ip: break
              time.sleep(1)
          if not ip: raise Exception("No IP on eth0")
          pod = socket.gethostname()
          print(f"Registering pcf-service.ims.mnc001.mcc452.3gppnetwork.org -> {ip} (pod: {pod})")
          urllib.request.urlopen(f"http://dns-server-service:9090/update?host=pcf-service.ims.mnc001.mcc452.3gppnetwork.org&ip={ip}&pod={pod}")
      volumes:
      - name: config-volume
        configMap:
          name: ims-sys-config
