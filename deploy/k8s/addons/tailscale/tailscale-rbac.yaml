apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-secret-manager
  namespace: demo-mini-app
rules:
- apiGroups: ['']
  resources: ['secrets']
  verbs: ['create']
- apiGroups: ['']
  resources: ['secrets']
  resourceNames: ['tailscale-pcscf', 'tailscale-mf']
  verbs: ['get', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-secret-manager-binding
  namespace: demo-mini-app
subjects:
- kind: ServiceAccount
  name: default
  namespace: demo-mini-app
roleRef:
  kind: Role
  name: tailscale-secret-manager
  apiGroup: rbac.authorization.k8s.io
