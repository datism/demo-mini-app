# 7. DC App Repository (Go - dcar)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcar
  namespace: demo-mini-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dcar
  template:
    metadata:
      labels:
        app: dcar
    spec:
      initContainers:
        - name: register-dns
          image: python:3.10-slim
          command:
            - python
            - -c
            - |
              import socket, fcntl, struct, urllib.request, time
              def get_ip(ifname):
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  try:
                      return socket.inet_ntoa(fcntl.ioctl(s.fileno(), 0x8915, struct.pack('256s', bytes(ifname[:15], 'utf-8')))[20:24])
                  except IOError:
                      return None
              ip = None
              for _ in range(10):
                  ip = get_ip('eth0')
                  if ip: break
                  time.sleep(1)
              if not ip: raise Exception("No IP on eth0")
              pod = socket.gethostname()
              print(f"Registering dcar-service.ims.mnc001.mcc452.3gppnetwork.org -> {ip} (pod: {pod})")
              urllib.request.urlopen(f"http://dns-server-service:9090/update?host=dcar-service.ims.mnc001.mcc452.3gppnetwork.org&ip={ip}&pod={pod}")
      containers:
        - name: dcar
          image: go-mf:local
          imagePullPolicy: IfNotPresent
          command: ["./dcar"]
          env:
            - name: ENABLE_HEP_SELF_LOGGING
              value: "true"
            - name: HEP_SERVER_HOST
              value: "heplify-server"
            - name: HEP_SERVER_PORT
              value: "9060"

            - name: INTERFACE_NAME
              value: "eth0"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exit 0
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exit 0
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: ims-sys-config

