apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-test
  namespace: demo-mini-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tool-test
  template:
    metadata:
      labels:
        app: tool-test
    spec:
      initContainers:
        - name: wait-for-services
          image: busybox:1.28
          command: ['sh', '-c', 'echo "Waiting for Redis..."; until nc -z redis-service 6379; do sleep 2; done; echo "Waiting for IMS-AS..."; until nc -z ims-as-cluster-headless 5070; do sleep 2; done; echo "Waiting for PCSCF..."; until nc -u -z pcscf-service 5060; do sleep 2; done; echo "All services are up! Sleeping 5s just in case..."; sleep 5;']
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              /usr/local/bin/containerboot &
              wait
          env:
            - name: TS_AUTHKEY
              value: "tskey-auth-kVUfS3HDFz11CNTRL-mDPskK6r5C6FYaQFSjcBC6L8R59NhCAb"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: "tailscale-tool-test"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
        - name: tool-test
          image: go-mf:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep 3; ./dc-test-tool -config test_scenarios.json; echo 'Test run finished. Sleeping forever to preserve logs...'; sleep infinity"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          workingDir: /app
          env:
            - name: ENABLE_HEP_SELF_LOGGING
              value: "true"
            - name: HEP_SERVER_HOST
              value: "heplify-server"
            - name: HEP_SERVER_PORT
              value: "9060"

            - name: INTERFACE_NAME
              value: "eth0"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            - name: scenario-volume
              mountPath: /app/test_scenarios.json
              subPath: test_scenarios.json
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: config-volume
          configMap:
            name: ims-sys-config
        - name: scenario-volume
          configMap:
            name: test-scenarios-config






