# Cấu hình DNS dùng chung cho các Pod để trỏ về dns-server cục bộ (192.168.100.9)
# dnsPolicy: None
# dnsConfig: nameservers = [192.168.100.9]

# 1. Proxy Call Session Control Function (Erlang - P-CSCF)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcscf
  namespace: demo-mini-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pcscf
  template:
    metadata:
      labels:
        app: pcscf
    spec:
      initContainers:
        - name: register-dns
          image: python:3.10-slim
          command:
            - python
            - -c
            - |
              import socket, fcntl, struct, urllib.request, time
              def get_ip(ifname):
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  try:
                      return socket.inet_ntoa(fcntl.ioctl(s.fileno(), 0x8915, struct.pack('256s', bytes(ifname[:15], 'utf-8')))[20:24])
                  except IOError:
                      return None
              ip_eth0 = None
              for _ in range(10):
                  if not ip_eth0: ip_eth0 = get_ip('eth0')
                  if ip_eth0: break
                  time.sleep(1)
              if not ip_eth0: raise Exception("No IP on eth0")
              pod = socket.gethostname()
              print(f"Registering pcscf.ims.mnc001.mcc452.3gppnetwork.org -> {ip_eth0} (pod: {pod})")
              urllib.request.urlopen(f"http://dns-server-service:9090/update?host=pcscf.ims.mnc001.mcc452.3gppnetwork.org&ip={ip_eth0}&pod={pod}")
              print(f"Registering pcscf-service.ims.mnc001.mcc452.3gppnetwork.org -> {ip_eth0} (pod: {pod})")
              urllib.request.urlopen(f"http://dns-server-service:9090/update?host=pcscf-service.ims.mnc001.mcc452.3gppnetwork.org&ip={ip_eth0}&pod={pod}")
      containers:
        # [OPTIONAL] TAILSCALE SIDECAR
        # Uncomment or keep this container if you want to expose P-CSCF over Tailscale (Internet environments).
        # For production/offline environments, simply comment out or delete this whole "tailscale" block.
        - name: tailscale
          image: tailscale/tailscale:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              /usr/local/bin/containerboot &
              wait
          env:
            - name: TS_AUTHKEY
              value: "tskey-auth-kVUfS3HDFz11CNTRL-mDPskK6r5C6FYaQFSjcBC6L8R59NhCAb"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: "tailscale-pcscf"
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
        - name: pcscf
          image: erlang-sip:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export ETH0_IP=$(ip addr show eth0 | grep "inet " | awk '{print $2}' | cut -d/ -f1)
              export NODE_NAME="$(NODE_ROLE)@${ETH0_IP}"
              exec /app/bin/ims_dc_sip foreground
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: ENABLE_HEP_SELF_LOGGING
              value: "true"
            - name: HEP_SERVER_HOST
              value: "heplify-server"
            - name: HEP_SERVER_PORT
              value: "9060"

            - name: NODE_ROLE
              value: "pcscf"
            - name: INTERFACE_NAME
              value: "eth0"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              value: "$(NODE_ROLE)@$(POD_IP)"
            - name: NODE_COOKIE
              value: "ims_dc_sip_cookie"
            - name: ERLANG_COOKIE
              value: "ims_dc_sip_cookie"
            - name: REDIS_SENTINEL_HOST
              value: "redis-sentinel-service.demo-mini-app.svc.cluster.local"
            - name: REDIS_SENTINEL_PORT
              value: "26379"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          livenessProbe:
            exec:
              command:
                - /app/bin/ims_dc_sip
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /app/bin/ims_dc_sip
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tailscale-state
          emptyDir: {}
        - name: config-volume
          configMap:
            name: ims-sys-config

