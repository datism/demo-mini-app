                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              value: "$(NODE_ROLE)@$(POD_IP)"
            - name: NODE_COOKIE
              value: "ims_dc_sip_cookie"
            - name: ERLANG_COOKIE
              value: "ims_dc_sip_cookie"
            - name: REDIS_SENTINEL_HOST
              value: "redis-sentinel-service.demo-mini-app.svc.cluster.local"
            - name: REDIS_SENTINEL_PORT
              value: "26379"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          livenessProbe:
            exec:
              command:
                - /app/bin/ims_dc_sip
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /app/bin/ims_dc_sip
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: ims-sys-config

