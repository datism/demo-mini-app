    spec:
      initContainers:
        - name: register-dns
          image: python:3.10-slim
          command:
            - python
            - -c
            - |
              import socket, fcntl, struct, urllib.request, time
              def get_ip(ifname):
                  s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  try:
                      return socket.inet_ntoa(fcntl.ioctl(s.fileno(), 0x8915, struct.pack('256s', bytes(ifname[:15], 'utf-8')))[20:24])
                  except IOError:
                      return None
              ip = None
              for _ in range(10):
                  ip = get_ip('eth0')
                  if ip: break
                  time.sleep(1)
              if not ip: raise Exception("No IP on eth0")
              pod = socket.gethostname()
              print(f"Registering icscf-service.ims.mnc001.mcc452.3gppnetwork.org -> {ip} (pod: {pod})")
              urllib.request.urlopen(f"http://dns-server-service:9090/update?host=icscf-service.ims.mnc001.mcc452.3gppnetwork.org&ip={ip}&pod={pod}")
      containers:
        - name: icscf
          image: erlang-sip:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              
              export NET1_IP=$(hostname -I | cut -d' ' -f1)
