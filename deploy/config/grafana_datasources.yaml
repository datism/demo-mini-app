apiVersion: 1

datasources:
  - name: qryn-loki
    type: loki
    access: proxy
    url: http://qryn:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - matcherRegex: "Call-ID:\\s*([^\\s\\r\\n]+)"
          name: CallID
          url: "http://localhost:8095/pcap?callid=$${__value.raw}"
          urlDisplayLabel: "Download PCAP"
    isDefault: true
