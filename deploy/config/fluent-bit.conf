[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*.log
    Parser           docker
    Tag              docker.*
    Docker_Mode      On
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[OUTPUT]
    Name          loki
    Match         docker.*
    Host          qryn
    Port          3100
    Labels        job=fluent-bit
    Label_Keys    $service, $level, $module, $call_id
