scope: db
namespace: demo-mini-app
name: postgres

kubernetes:
  use_endpoints: true
  pod_ip: ${PATRONI_KUBERNETES_POD_IP}
  ports:
    - name: postgres
      port: 5432
  labels:
    app: db
    cluster-name: db
  role_label: role

postgresql:
  listen: '*:5432'
  connect_address: ${PATRONI_KUBERNETES_POD_IP}:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/local/bin
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 trust
    - host all all ::1/128 trust
    - host replication replicator 127.0.0.1/32 trust
    - host replication replicator ::1/128 trust
    - host replication replicator 0.0.0.0/0 trust
    - host replication replicator ::/0 trust
    - host all all 0.0.0.0/0 md5
    - host all all ::/0 md5
  authentication:
    replication:
      username: replicator
      password: replpassword
    superuser:
      username: postgres
      password: homerSeven

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    postgresql:
      use_pg_rewind: true
      use_slots: true
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 trust
    - host all all ::1/128 trust
    - host replication replicator 127.0.0.1/32 trust
    - host replication replicator ::1/128 trust
    - host replication replicator 0.0.0.0/0 trust
    - host replication replicator ::/0 trust
    - host all all 0.0.0.0/0 md5
    - host all all ::/0 md5
  post_init: /etc/patroni/setup_db.sh

restapi:
  listen: '0.0.0.0:8008'
  connect_address: ${PATRONI_KUBERNETES_POD_IP}:8008
