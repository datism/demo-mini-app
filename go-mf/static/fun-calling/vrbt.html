<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Ringback Tone</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top left, #23252f, #0c0e14);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #vrbt-container {
      width: 90%;
      max-width: 360px;
      height: 90%;
      max-height: 600px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
    }

    /* Vibrant abstract pulse visualizer */
    .visualizer-box {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, rgba(99, 102, 241, 0.1) 70%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-top: 40px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(236, 72, 153, 0.4);
      animation: pulseAnim 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.8s;
      border-color: rgba(99, 102, 241, 0.4);
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 1.6s;
      border-color: rgba(168, 85, 247, 0.4);
    }

    @keyframes pulseAnim {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    .vinyl-art {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .vinyl-art svg {
      width: 38px;
      height: 38px;
      fill: #fff;
    }

    /* Heading Info */
    .info-section {
      text-align: center;
      margin: 20px 0;
    }

    .info-section h2 {
      font-size: 20px;
      margin: 0 0 6px 0;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(120deg, #f472b6, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info-section p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
    }

    /* Buttons block */
    .button-group {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-bottom: 20px;
    }

    .vrbt-btn {
      flex: 1;
      height: 48px;
      border-radius: 24px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .vrbt-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .vrbt-btn:active {
      transform: translateY(0);
    }

    .vrbt-btn.active {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3);
      border-color: transparent;
    }

    .vrbt-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
  </style>
</head>
<body>

  <div id="vrbt-container">
    <div class="visualizer-box">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="vinyl-art">
        <svg viewBox="0 0 24 24">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </div>
    </div>

    <div class="info-section">
      <h2>Video Ringback Tone</h2>
      <p id="vrbt-target-label">Calling User...</p>
    </div>

    <div class="button-group">
      <button class="vrbt-btn" id="btn-mute" onclick="toggleMute()">
        <svg id="icon-mute" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span id="text-mute">Mute</span>
      </button>

      <button class="vrbt-btn" id="btn-like" onclick="likeVideo()">
        <svg viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        Like
      </button>
    </div>
  </div>

  <script>
    // Extract user target from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const targetUser = urlParams.get('user') || 'Bob';
    document.getElementById('vrbt-target-label').innerText = "Ringing " + targetUser + "...";

    let isMuted = false;
    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('btn-mute');
      const text = document.getElementById('text-mute');
      const icon = document.getElementById('icon-mute');

      if (isMuted) {
        btn.classList.add('active');
        text.innerText = 'Unmute';
        icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
      } else {
        btn.classList.remove('active');
        text.innerText = 'Mute';
        icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
      }
    }

    function likeVideo() {
      const btn = document.getElementById('btn-like');
      btn.classList.toggle('active');
      console.log("[VRBT] User clicked Like on the Video Ringback Tone.");
    }
  </script>
</body>
</html>
