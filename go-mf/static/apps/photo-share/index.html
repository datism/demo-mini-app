<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Share — 5G New Calling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117;
                 font-family: 'Segoe UI', Roboto, sans-serif; color: #e6edf3; }

    /* ── Header ── */
    #header { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 30;
              display: flex; align-items: center; justify-content: space-between;
              padding: 0 14px; background: rgba(13,17,23,0.92); border-bottom: 1px solid #21262d; }
    #header .title { font-size: 15px; font-weight: 600; }
    #header .status { font-size: 11px; color: #8b949e; }
    #btnPick { background: #238636; color: #fff; border: none; border-radius: 16px;
               padding: 6px 14px; font-size: 13px; font-weight: 600; }

    /* ── Viewer ── */
    #viewer { position: absolute; top: 44px; bottom: 96px; left: 0; right: 0;
              overflow: hidden; background: #010409; touch-action: none; }
    #imgCanvasWrap { position: absolute; top: 0; bottom: 0; left: 0; right: 0;
                     display: flex; align-items: center; justify-content: center; }
    /* Kích thước do sizeCanvas() tính (fit vào #viewer) — max-width/height % không hoạt động vì #stage co theo ảnh. */
    #photoImg, #photoVideo { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
    #photoImg { -webkit-user-drag: none; }
    #photoVideo { width: 90vw; max-height: calc(100vh - 150px); background: #000; }
    #strip .video-thumb { flex: 0 0 auto; width: 78px; height: 78px; border-radius: 8px; border: 2px solid #30363d; background: #161b22; display:flex; align-items:center; justify-content:center; font-size:26px; }
    #strip .video-thumb.active { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.4); }
    #drawCanvas { position: absolute; inset: 0; display: block; pointer-events: none; touch-action: none; }

    /* ── Loading spinner ── */
    #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
              text-align: center; display: none; z-index: 5; }
    #loader .spin { width: 42px; height: 42px; border: 4px solid #30363d;
                    border-top-color: #58a6ff; border-radius: 50%; margin: 0 auto 10px;
                    animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader .pct { font-size: 12px; color: #8b949e; }

    /* ── Empty state ── */
    #empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
             text-align: center; color: #484f58; }
    #empty .icon { font-size: 52px; margin-bottom: 10px; }
    #empty .txt { font-size: 14px; }

    /* ── Toolbar vẽ ── */
    #drawBar { position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
               display: flex; flex-direction: column; gap: 10px; z-index: 50; }
    #drawBar button { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; border: 2px solid #30363d;
                      background: #161b22; font-size: 18px; color: #e6edf3; touch-action: manipulation; }
    #drawBar button.active { border-color: #58a6ff; background: #1f3a56; }
    #drawBar .swatch { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; border: 2px solid #30363d; }
    #drawBar .palette-item { display: none; }
    #drawBar .swatch.active { border-color: #fff; transform: scale(1.12); }

    /* ── Thumbnail strip ── */
    #strip { position: fixed; bottom: 0; left: 0; right: 0; height: 96px; z-index: 30;
             display: flex; gap: 6px; padding: 8px; overflow-x: auto;
             background: rgba(13,17,23,0.95); border-top: 1px solid #21262d; }
    #strip .thumb { flex: 0 0 auto; width: 78px; height: 78px; border-radius: 8px;
                    border: 2px solid #30363d; object-fit: cover; background: #161b22; }
    #strip .thumb.active { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.4); }

    /* ── Hint toast ── */
    #toast { position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
             background: rgba(30,35,42,0.96); color: #e6edf3;
             padding: 8px 16px; border-radius: 18px; font-size: 12px; z-index: 40;
             border: 1px solid #30363d; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="header">
  <div>
    <div class="title">📷 Chia sẻ ảnh và video</div>
    <div class="status" id="statusText">Đang kết nối...</div>
  </div>
  <button id="btnPick">＋ Chọn media</button>
</div>

<div id="viewer">
  <div id="imgCanvasWrap">
    <div style="position:relative; display:inline-block;" id="stage">
      <img id="photoImg" alt="" style="display:none">
      <video id="photoVideo" controls playsinline preload="metadata" style="display:none"></video>
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>
  <div id="loader"><div class="spin"></div><div class="pct" id="loaderPct">0%</div></div>
  <div id="empty">
    <div class="icon">🖼️</div>
    <div class="txt">Chưa có ảnh — bấm “Chọn ảnh”<br>hoặc chờ đối phương chia sẻ</div>
  </div>
</div>

<div id="drawBar">
  <button id="btnDraw" title="Bút vẽ">✏️</button>
  <div class="swatch active" style="background:#ff3b30" data-color="#ff3b30"></div>
  <div class="swatch" style="background:#30d158" data-color="#30d158"></div>
  <div class="swatch" style="background:#0a84ff" data-color="#0a84ff"></div>
  <div class="swatch" style="background:#ffd60a" data-color="#ffd60a"></div>
  <button id="btnClearDraw" title="Xóa nét vẽ">🧹</button>
</div>

<div id="strip"></div>
<div id="toast"></div>

<input type="file" id="fileInput" accept="image/*,video/mp4" multiple style="display:none">

<script>
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════
   * PHOTO-SHARE mini-app
   *
   * Wire protocol (2 lớp trên ADC stream 1000, P2P qua MF):
   *   A. JSON control  —/native→sendOrQueueAdc (text path). Msg types:
   *      {t:"offer",  photos:[{id,w,h,bytes,thumb}]}
   *      {t:"fetch",  id, fromSeq?}
   *      {t:"begin",  id, chunks, bytes, sha256}
   *      {t:"done",   id, ok}
   *      {t:"goto",   id, seq}
   *      {t:"stroke", id, color, w, pts:[[x,y]∈[0,1],...]}
   *      {t:"clear",  id}
   *   B. Binary chunk — native PhotoShareTransport tự xử lý (byte đầu 0x01),
   *      khi đủ chunks đẩy lên JS: window.receiveData("PSHARE:<idHash>:<b64>")
   *
   * Nhận từ xa: mọi msg đến qua window.receiveData(dataStr).
   * ═══════════════════════════════════════════════════════════════════ */

  const $ = id => document.getElementById(id);
  const state = {
    photos: {},            // id → {id,w,h,bytes,thumb,ready(bool),url?,strokes:[]}
    order: [],             // thứ tự strip
    current: null,         // photoId đang xem
    seq: 0,                //counter cho goto LWW
    drawMode: false,
    paletteOpen: false,
    color: '#ff3b30',
    preloading: {},
  };

  /* ─────────────── Bridge helpers ─────────────── */
  function sendJson(obj) {
    const s = JSON.stringify(obj);
    if (window.AndroidBridge && window.AndroidBridge.send) {
      window.AndroidBridge.send(1000, s);
    } else if (window.AndroidBridge && window.AndroidBridge.sendData) {
      window.AndroidBridge.sendData(s);
    } else { console.warn('[PS] no bridge', s); }
  }

  /* ─────────────── Toast + status ─────────────── */
  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
  }
  function setStatus(s) { $('statusText').textContent = s; }

  /* ─────────────── Thumbnail strip ─────────────── */
  function renderStrip() {
    const strip = $('strip'); strip.innerHTML = '';
    state.order.forEach(id => {
      const p = state.photos[id];
      const thumb = p.kind === 'video' ? document.createElement('div') : document.createElement('img');
      thumb.className = (p.kind === 'video' ? 'video-thumb' : 'thumb') + (id === state.current ? ' active' : '');
      if (p.kind === 'video') thumb.textContent = '▶';
      else if (p.thumbUrl) thumb.src = p.thumbUrl;
      thumb.onclick = () => gotoPhoto(id, true);
      strip.appendChild(thumb);
    });
  }

  /* ─────────────── Hiển thị ảnh ─────────────── */
  function showPhoto(p) {
    $('empty').style.display = 'none';
    const img = $('photoImg'), video = $('photoVideo');
    if (p.kind === 'video') {
      img.style.display = 'none';
      $('drawCanvas').style.display = 'none';
      video.style.display = 'block';
      if (video.src !== p.url) { video.pause(); video.src = p.url; video.load(); }
      return;
    }
    video.pause(); video.removeAttribute('src'); video.style.display = 'none';
    $('drawCanvas').style.display = 'block';
    img.onload = () => { sizeCanvas(); redrawStrokes(); };
    img.src = p.url; img.style.display = 'block';
    requestAnimationFrame(() => { sizeCanvas(); redrawStrokes(); });
  }

  function sizeCanvas() {
    const img = $('photoImg'); const c = $('drawCanvas');
    if (!img.naturalWidth || state.photos[state.current]?.kind === 'video') return;
    // Fit (contain) vào #viewer: cả thumb 256px lẫn ảnh 1920px đều hiện đúng khung, hai bên giống nhau.
    const viewer = $('viewer');
    if (!viewer.clientWidth || !viewer.clientHeight) return;
    const k = Math.min(viewer.clientWidth / img.naturalWidth, viewer.clientHeight / img.naturalHeight);
    const rect = { width: Math.max(1, Math.floor(img.naturalWidth * k)), height: Math.max(1, Math.floor(img.naturalHeight * k)) };
    img.style.width = rect.width + 'px';
    img.style.height = rect.height + 'px';
    const stage = $('stage');
    stage.style.width = rect.width + 'px';
    stage.style.height = rect.height + 'px';
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.round(rect.width * dpr); c.height = Math.round(rect.height * dpr);
    c.style.width = rect.width + 'px'; c.style.height = rect.height + 'px';
    // Assigning width/height resets the context; set a fresh DPR transform instead
    // of accumulating scale factors every time the view is resized.
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    // canvas phủ NGANG TRÊN ảnh để bắt touch
    c.style.pointerEvents = state.drawMode ? 'auto' : 'none';
  }

  function redrawStrokes() {
    const c = $('drawCanvas'); const ctx = c.getContext('2d');
    const p = state.photos[state.current];
    const canvasRect = c.getBoundingClientRect();
    ctx.clearRect(0, 0, canvasRect.width, canvasRect.height);
    if (!p) return;
    const imageRect = $('photoImg').getBoundingClientRect();
    p.strokes.forEach(st => drawStrokeOn(ctx, st, imageRect.width, imageRect.height));
  }
  function drawStrokeOn(ctx, st, w, h) {
    if (!st.pts || !st.pts.length) return;
    ctx.strokeStyle = st.color; ctx.lineWidth = st.w || 3;
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath();
    st.pts.forEach((pt, i) => {
      const x = pt[0] * w, y = pt[1] * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    if (st.pts.length === 1) {
      const x = st.pts[0][0] * w, y = st.pts[0][1] * h;
      ctx.beginPath(); ctx.arc(x, y, (st.w || 3) / 2, 0, Math.PI * 2);
      ctx.fillStyle = st.color; ctx.fill();
    } else {
      ctx.stroke();
    }
  }

  /* ─────────────── Điều hướng (goto + LWW) ─────────────── */
  function gotoPhoto(id, userInitiated) {
    const p = state.photos[id];
    if (!p) return;
    state.current = id;
    renderStrip();
    if (p.ready && p.url) { showPhoto(p); }
    else { fetchPhoto(id); }

    // preload lân cận — vuốt tiếp là có ngay
    const idx = state.order.indexOf(id);
    [idx + 1, idx - 1].forEach(i => {
      const nid = state.order[i];
      if (nid && state.photos[nid] && !state.photos[nid].ready) fetchPhoto(nid);
    });

    if (userInitiated) {
      state.seq++;
      sendJson({ t: 'goto', id: id, seq: state.seq });
    }
  }

  function onRemoteGoto(msg) {
    if (typeof msg.seq === 'number' && msg.seq <= state.gotSeqMax) return; // LWW drop
    state.gotSeqMax = msg.seq || 0;
    if (!state.photos[msg.id]) { toast('Đối phương đang xem media chưa tải về'); return; }
    gotoPhoto(msg.id, false);
  }

  /* ─────────────── Fetch / nhận ảnh ─────────────── */
  function fetchPhoto(id) {
    const p = state.photos[id];
    if (!p || p.fetching) return;
    p.fetching = true;
    if (p.local) {
      // ảnh của chính máy mình — có sẵn qua /media/
      p.ready = true; p.url = window.AndroidBridge ? (p.kind === 'video' ? window.AndroidBridge.videoUrl(id) : window.AndroidBridge.mediaUrl(id, false)) : '';
      if (state.current === id) showPhoto(p);
      p.fetching = false;
      return;
    }
    showLoader(0, p.kind === 'video' ? 'Đang nhận video...' : 'Đang nhận ảnh...');
    sendJson({ t: 'fetch', id: id });
    // Local thumb hiển thị tạm trong lúc chờ full
    if (p.thumbUrl && state.current === id) showPhoto({ url: p.thumbUrl });
  }

  function showLoader(pct, label) {
    const loader = $('loader');
    if (pct === null) { loader.style.display = 'none'; return; }
    loader.style.display = 'block';
    $('loaderPct').textContent = (label || '') + ' ' + pct + '%';
  }

  function onBegin(msg) {
    const p = state.photos[msg.id];
    if (!p) return;
    p.chunks = msg.chunks; p.chunksGot = 0; p.sha256 = msg.sha256;
  }

  /** Frame media đã ghép xong phía native: "PSHARE:<idHash>:<base64>" */
  function onPshare(idHash, b64) {
    // quy idHash → id qua bảng photos
    const id = Object.keys(state.photos).find(
      k => hash16(k) === Number(idHash)
    );
    if (!id) { console.warn('[PS] unknown idHash', idHash); return; }
    const p = state.photos[id];
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (p.url) URL.revokeObjectURL(p.url);
    p.url = URL.createObjectURL(new Blob([bytes], { type: p.mimeType || 'image/jpeg' }));
    p.ready = true; p.fetching = false;
    showLoader(null);
    if (state.current === id) showPhoto(p);
    sendJson({ t: 'done', id: id, ok: true });
    toast(p.kind === 'video' ? '🎬 Đã nhận video' : '📸 Đã nhận ảnh');
  }
  function hash16(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return h & 0xffff; }

  /* ─────────────── Chọn ảnh (máy mình là nguồn) ─────────────── */
  $('btnPick').onclick = () => $('fileInput').click();
  const MAX_VIDEO_BYTES = 6 * 1024 * 1024; // Bản đơn giản: giới hạn video 6 MiB vì payload đi qua JS bridge/base64.

  function blobToB64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(r.error || new Error('read_failed'));
      r.readAsDataURL(blob);
    });
  }

  /** File ảnh -> base64 JPEG đã thu nhỏ (EXIF đã được áp khi decode). Lỗi decode: chỉ nhận file nhỏ nguyên bản. */
  async function fileToJpegB64(file) {
    try {
      const bmp = await createImageBitmap(file);
      const MAX = 1920, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k));
      c.height = Math.max(1, Math.round(bmp.height * k));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
      if (blob) return await blobToB64(blob);
    } catch (e) { /* rơi xuống bản gốc */ }
    if (file.size > 6 * 1024 * 1024) throw new Error('ảnh quá lớn');
    return await blobToB64(file);
  }

  $('fileInput').onchange = async () => {
    const files = Array.from($('fileInput').files || []);
    $('fileInput').value = ''; // cho phép chọn lại đúng ảnh đó lần sau
    if (!files.length) return;
    if (!window.AndroidBridge) {
      toast('Không tìm thấy AndroidBridge'); return;
    }
    toast('Đã chọn ' + files.length + ' tệp, đang xử lý...');
    const offered = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const fileName = (file.name || '').toLowerCase();
      // Some Android document providers return an empty or generic MIME type; use extension as fallback.
      const isVideo = file.type.startsWith('video/') || fileName.endsWith('.mp4');
      const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/.test(fileName);
      if (!isVideo && !isImage) { toast('Không nhận diện được định dạng: ' + (file.name || file.type || 'unknown')); continue; }
      if (isVideo && fileName && !fileName.endsWith('.mp4')) { toast('Hiện chỉ hỗ trợ video MP4'); continue; }
      if (isVideo && file.size > MAX_VIDEO_BYTES) { toast('Video vượt quá giới hạn 6 MiB'); continue; }
      const kind = isVideo ? 'video' : 'image';
      const mimeType = isVideo ? 'video/mp4' : 'image/jpeg';
      const id = (isVideo ? 'v' : 'p') + Date.now() + '_' + i;
      // WebView <input type=file> trả File object. Thu nhỏ ảnh trong trang (canvas, cạnh dài 1920, JPEG):
      // ảnh 12-50 MP dạng base64 qua JS bridge nặng hàng chục MB và làm treo cả app.
      let b64;
      try { b64 = isVideo ? await blobToB64(file) : await fileToJpegB64(file); }
      catch (e) { toast('Không đọc được media: ' + (e && e.message || e)); continue; }
      const requiredImportMethod = isVideo ? window.AndroidBridge.importVideoB64 : window.AndroidBridge.importPhotoB64;
      if (typeof requiredImportMethod !== 'function') {
        toast('AndroidBridge chưa có hàm import ' + kind);
        continue;
      }
      let res;
      try {
        const payload = JSON.stringify({ id: id, data: b64, type: mimeType });
        // Call directly on the injected object. Detaching a @JavascriptInterface method
        // into a local variable makes WebView reject it as a non-injected object.
        const rawResult = isVideo
          ? window.AndroidBridge.importVideoB64(payload)
          : window.AndroidBridge.importPhotoB64(payload);
        res = JSON.parse(rawResult || '{}');
      } catch (e) {
        toast('Lỗi khi gửi tệp sang Android: ' + (e && e.message || e));
        continue;
      }
      if (res.ok) {
        state.photos[id] = {
          id, kind, mimeType, w: 0, h: 0, bytes: res.bytes, local: true, ready: true,
          url: isVideo ? window.AndroidBridge.videoUrl(id) : window.AndroidBridge.mediaUrl(id, false),
          thumbUrl: isVideo ? '' : window.AndroidBridge.mediaUrl(id, true),
          strokes: [],
        };
        state.order.push(id);
        offered.push({ id, bytes: res.bytes, kind, mimeType, thumb: isVideo ? '' : await thumbB64Of(id) });
      } else {
        toast('Không nhập được media: ' + (res.error || '?'));
      }
    }
    renderStrip();
    if (offered.length) {
      gotoPhoto(offered[0].id, true);
      setStatus('Đã chia sẻ ' + offered.length + ' media');
      toast('Đã chia sẻ ' + offered.length + ' media');
      // Thumb base64 kèm theo offer — phía nhận hiện strip ngay không cần fetch full.
      const photosPayload = [];
      for (const o of offered) {
        photosPayload.push({ id: o.id, bytes: o.bytes, kind: o.kind, mimeType: o.mimeType, thumb: o.thumb });
      }
      sendJson({ t: 'offer', photos: photosPayload });
    }
  };

  /** Đọc thumbnail <id>_t.jpg từ photostore qua /media/ rồi trả base64 thuần. */
  async function thumbB64Of(id) {
    try {
      const url = window.AndroidBridge.mediaUrl(id, true);
      const resp = await fetch(url);
      if (!resp.ok) return '';
      const buf = new Uint8Array(await resp.arrayBuffer());
      let bin = '';
      for (let j = 0; j < buf.length; j += 0x8000) {
        bin += String.fromCharCode.apply(null, buf.subarray(j, j + 0x8000));
      }
      return btoa(bin);
    } catch (e) { return ''; }
  }

  /* ─────────────── Nhận offer từ xa ─────────────── */
  function onOffer(msg) {
    (msg.photos || []).forEach(ph => {
      if (state.photos[ph.id]) return;
      let thumbUrl = '';
      if (ph.thumb) { // data URL hoặc base64 thuần
        thumbUrl = ph.thumb.startsWith('data:') ? ph.thumb : 'data:image/jpeg;base64,' + ph.thumb;
      }
      state.photos[ph.id] = {
        id: ph.id, kind: ph.kind || 'image', mimeType: ph.mimeType || 'image/jpeg',
        bytes: ph.bytes, ready: false, strokes: [], thumbUrl: thumbUrl,
      };
      state.order.push(ph.id);
    });
    renderStrip();
    toast('📨 Đối phương chia sẻ ' + msg.photos.length + ' media');
    if (!state.current && msg.photos.length) gotoPhoto(msg.photos[0].id, false);
  }

  /* ─────────────── Xử lý fetch từ xa (máy mình có ảnh local) ─────────────── */
  function onFetch(msg) {
    const p = state.photos[msg.id];
    if (!p || !p.local || !window.AndroidBridge) return;
    const payload = JSON.stringify({ id: msg.id });
    const rawResult = p.kind === 'video'
      ? window.AndroidBridge.sendVideo(payload)
      : window.AndroidBridge.sendPhoto(payload);
    const res = JSON.parse(rawResult || '{}');
    if (res.ok) {
      sendJson({ t: 'begin', id: msg.id, chunks: res.chunks, bytes: res.bytes, kind: p.kind, mimeType: p.mimeType });
    }
  }

  /* ═══════════════ Vẽ trên ảnh ═══════════════ */
  $('btnDraw').onclick = () => {
    if (state.photos[state.current]?.kind === 'video') { toast('Không thể vẽ lên video'); return; }
    state.paletteOpen = !state.paletteOpen;
    $('btnDraw').classList.toggle('active', state.paletteOpen);
    document.querySelectorAll('#drawBar .palette-item').forEach(item => {
      item.style.display = state.paletteOpen ? 'block' : 'none';
    });
  };
  // Drawing stays enabled; the pencil only expands/collapses the palette.
  state.drawMode = true;
  $('drawCanvas').style.pointerEvents = 'auto';
  document.querySelectorAll('#drawBar .swatch').forEach(s => s.classList.add('palette-item'));
  $('btnClearDraw').classList.add('palette-item');

  document.querySelectorAll('#drawBar .swatch').forEach(sw => {
    sw.onclick = () => {
      state.color = sw.dataset.color;
      document.querySelectorAll('#drawBar .swatch').forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
    };
  });

  $('btnClearDraw').onclick = () => {
    const p = state.photos[state.current];
    if (p) { p.strokes = []; redrawStrokes(); sendJson({ t: 'clear', id: state.current }); }
  };

  /* Pointer events cho canvas vẽ */
  (function () {
    const c = $('drawCanvas');
    let stroking = null;
    const norm = e => {
      const r = c.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
    };
    c.addEventListener('pointerdown', e => {
      if (!state.drawMode) return;
      e.preventDefault();
      stroking = { color: state.color, w: 3, pts: [norm(e)] };
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (!stroking) return;
      e.preventDefault();
      stroking.pts.push(norm(e));
      // preview cục bộ
      const ctx = c.getContext('2d');
      const p = state.photos[state.current];
      if (p) {
        const rect = c.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        redrawStrokes(); drawStrokeOn(ctx, stroking, rect.width, rect.height);
      }
    });
    const finish = () => {
      if (!stroking) return;
      const p = state.photos[state.current];
      if (p && stroking.pts.length > 0) {
        p.strokes.push(stroking);
        sendJson({ t: 'stroke', id: p.id, color: stroking.color, w: stroking.w, pts: stroking.pts });
        redrawStrokes();
      }
      stroking = null;
    };
    c.addEventListener('pointerup', finish);
    c.addEventListener('pointercancel', finish);
    c.addEventListener('lostpointercapture', finish);
  })();

  function onRemoteStroke(msg) {
    const p = state.photos[msg.id];
    if (!p) return;
    if (state.current === msg.id) {
      p.strokes.push({ color: msg.color, w: msg.w, pts: msg.pts });
      redrawStrokes();
    } else {
      p.strokes.push({ color: msg.color, w: msg.w, pts: msg.pts });
      if (!state.hintedOther) { toast('✏️ Đối phương vẽ trên ảnh khác'); state.hintedOther = true; }
    }
  }
  function onRemoteClear(msg) {
    const p = state.photos[msg.id];
    if (p) { p.strokes = []; if (state.current === msg.id) redrawStrokes(); }
  }

  /* ─────────────── Vuốt trái/phải trên viewer ─────────────── */
  (function () {
    const viewer = $('viewer');
    let sx = null, sy = null, t0 = 0;
    viewer.addEventListener('pointerdown', e => {
      if (e.target === $('drawCanvas') && state.drawMode) return; // vẽ ưu tiên
      sx = e.clientX; sy = e.clientY; t0 = Date.now();
    });
    viewer.addEventListener('pointerup', e => {
      if (sx === null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;         // quá ngắn / dọc
      if (Date.now() - t0 > 700) return;                          // quá chậm
      const idx = state.order.indexOf(state.current);
      const next = dx < 0 ? idx + 1 : idx - 1;                    // trái sang phải = ảnh trước
      if (next >= 0 && next < state.order.length) gotoPhoto(state.order[next], true);
    });
  })();

  /* ═══════════════ ĐIỂM VÀO DUY NHẤT: nhận message ═══════════════ */
  window.receiveData = function (dataStr) {
    try {
      // 1) Binary photo frame đã ghép: "PSHARE:<idHash>:<b64>"
      if (dataStr.startsWith('PSHARE:')) {
        const parts = dataStr.split(':');
        onPshare(parts[1], parts.slice(2).join(':'));
        return;
      }
      // 2) JSON control
      const msg = JSON.parse(dataStr);
      switch (msg.t) {
        case 'offer':  onOffer(msg); break;
        case 'fetch':  onFetch(msg); break;
        case 'begin':  onBegin(msg); break;
        case 'done':   if (msg.ok) setStatus('Đã gửi xong'); break;
        case 'goto':   onRemoteGoto(msg); break;
        case 'stroke': onRemoteStroke(msg); break;
        case 'clear':  onRemoteClear(msg); break;
      }
    } catch (err) {
      console.warn('[PS] bad message', err, dataStr && dataStr.slice(0, 80));
    }
  };

  /* Bridge qua GSMA _dsbridge nếu app chạy SDK path (dataChannelNotify đã có) */
  window.addEventListener('load', () => {
    setStatus('Sẵn sàng');
    // Yêu cầu ADC nếu chưa có (khi vào app bằng deep-link không qua operator-menu)
    if (window.ImsDcBridge && window.ImsDcBridge.createDataChannel) {
      window.ImsDcBridge.createDataChannel('photo-share');
    } else if (window._dsbridge) {
      try { window._dsbridge.call('createAppDataChannel', 'photo-share'); } catch (e) {}
    }
  });

  /* Xử lý window resize (xoay màn hình) */
  window.addEventListener('resize', () => { sizeCanvas(); redrawStrokes(); });

  /* gọi dọn URL blobs khi app bị đóng */
  window.cleanUpImsDcObjects = function () {
    Object.values(state.photos).forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
    state.photos = {}; state.order = []; state.current = null;
  };
</script>
</body>
</html>
