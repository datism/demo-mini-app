<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fun Calling Mini-App</title>
  <style>
    /* In-call home: the operator-menu app tray at the bottom, an emote dropdown on the right. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Emote dropdown: a small toggle at the top right, the emotes drop down vertically under it. */
    .emote {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .emote-toggle,
    .emote-list button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font-size: 20px;
      line-height: 1;
      padding: 0;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s ease, background .12s ease;
    }
    .emote-toggle:active,
    .emote-list button:active {
      transform: scale(.88);
      background: rgba(255, 255, 255, 0.28);
    }
    .emote-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform-origin: top center;
      transition: opacity .18s ease, transform .2s cubic-bezier(.2, .8, .2, 1);
    }
    .emote-list button {
      width: 36px;
      height: 36px;
      font-size: 18px;
    }
    /* ＋ and the emoji panel: Android's emoji, drawn by the phone's emoji font; nothing to type */
    .emote-list button.plus { font-size: 20px; font-weight: 600; }
    .emoji-sheet { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-end; }
    .emoji-sheet.hidden { display: none; }
    .emoji-panel {
      width: 100%; height: 58vh; background: rgba(28, 28, 32, 0.97); border-radius: 18px 18px 0 0;
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .emoji-head { display: flex; align-items: center; padding: 6px 8px 0; }
    .emoji-tabs { flex: 1; display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; }
    .emoji-tabs::-webkit-scrollbar { display: none; }
    .emoji-tabs button, .emoji-close {
      flex: 0 0 auto; width: 40px; height: 40px; border: 0; border-radius: 10px;
      background: transparent; font-size: 22px; padding: 0; opacity: .55; color: #fff;
    }
    .emoji-tabs button.on { opacity: 1; background: rgba(255, 255, 255, 0.12); }
    .emoji-close { opacity: .8; font-size: 18px; }
    .emoji-title { color: rgba(255, 255, 255, 0.6); font: 500 12px sans-serif; padding: 6px 14px 2px; }
    .emoji-grid {
      flex: 1; overflow-y: auto; padding: 4px 8px 10px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); align-content: start;
    }
    .emoji-grid button { height: 44px; border: 0; background: transparent; font-size: 28px; padding: 0; border-radius: 10px; }
    .emoji-grid button:active { background: rgba(255, 255, 255, 0.15); }
    .emote-list.hidden {
      opacity: 0;
      transform: translateY(-8px) scaleY(.6);
      pointer-events: none;
    }

    /* App tray: same look as operator-menu. */
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 12px 10px;
      box-sizing: border-box;
    }
    .tray {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 14px 6px 10px;
      box-sizing: border-box;
      z-index: 100;
      transition: opacity .2s ease, transform .25s cubic-bezier(.2, .8, .2, 1);
    }
    .tray.hidden {
      opacity: 0;
      transform: translateY(16px) scale(.96);
      pointer-events: none;
    }
    .handle {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 14px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .handle::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      width: 32px;
      height: 4px;
      margin-left: -16px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
    }
    .row {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 0 4px;
    }
    .app {
      flex: 0 0 auto;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 0;
      padding: 0;
      background: none;
      color: #fff;
      cursor: pointer;
    }
    .app .ic {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: rgba(255, 255, 255, 0.14);
      transition: transform .12s ease, background .12s ease;
    }
    .app:active .ic {
      transform: scale(.9);
      background: rgba(255, 255, 255, 0.28);
    }
    .app .lbl {
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.1;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
    .chip {
      position: absolute;
      bottom: 10px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      z-index: 100;
      transition: opacity .2s ease, transform .2s ease;
    }
    .chip.hidden {
      opacity: 0;
      transform: scale(.6);
      pointer-events: none;
    }

    /* Floating Stickers Container */
    #animation-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      100% {
        transform: translateY(-95vh) translateX(25px) scale(0.8) rotate(15deg);
        opacity: 0;
      }
    }

    .floating-emoji {
      position: absolute;
      bottom: 0;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: floatUp 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .emoji-icon {
      font-size: 64px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.95));
      display: inline-block;
      transform: translateZ(0);
    }
  </style>
</head>

<body>
  <div id="animation-area"></div>

  <div class="emote">
    <button class="emote-toggle" id="emote-toggle" onclick="toggleEmotes()" aria-label="Biểu cảm">❤️</button>
    <div class="emote-list hidden" id="emote-list">
      <div id="emote-recent" style="display:contents"></div>
      <button class="plus" id="emote-plus" onclick="openPicker()" title="Emoji khác">＋</button>
    </div>
  </div>

  <div class="emoji-sheet hidden" id="emoji-sheet" onclick="if (event.target === this) closePicker()">
    <div class="emoji-panel" role="dialog" aria-label="Chọn emoji">
      <div class="emoji-head">
        <div class="emoji-tabs" id="emoji-tabs"></div>
        <button class="emoji-close" onclick="closePicker()" aria-label="Đóng">✕</button>
      </div>
      <div class="emoji-title" id="emoji-title"></div>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
  </div>

  <div class="tray" id="tray" role="toolbar" aria-label="5G New Calling">
    <button class="handle" onclick="setOpen(false)" aria-label="Thu gọn"></button>
    <div class="row">
      <button class="app" onclick="launchApp('sketch-sync-app')"><span class="ic">🎨</span><span class="lbl">Vẽ</span></button>
      <button class="app" onclick="launchApp('photo-share')"><span class="ic">📲</span><span class="lbl">Chia sẻ</span></button>
      <button class="app" onclick="launchApp('caro')"><span class="ic">♟️</span><span class="lbl">Caro</span></button>
    </div>
  </div>
  <button class="chip hidden" id="chip" onclick="setOpen(true)" aria-label="Mở ứng dụng">✨</button>

  <script>
    function toggleEmotes() {
      const closed = document.getElementById('emote-list').classList.toggle('hidden');
      document.getElementById('emote-toggle').textContent = closed ? '❤️' : '✕';
      if (closed) closePicker();
    }

    const RECENT_KEY = 'emote.recent', MAX_RECENT = 4;
    const DEFAULT_RECENT = ['❤️', '👍', '😊', '😡'];
    // The old five keep their keywords so pages without the panel still show them.
    const KEYWORD = { '❤️': 'heart', '👍': 'like', '😊': 'smile', '😡': 'angry', '👋': 'wave' };
    // Slots keep their place: tapping one only marks it used; a new emoji from ＋ takes the slot
    // used longest ago, in that same position. Stored as [{e, t}] (emoji, last-used time).
    function loadSlots() {
      try {
        const a = JSON.parse(localStorage.getItem(RECENT_KEY) || 'null');
        if (Array.isArray(a) && a.length) {
          const slots = a.map((x, k) => typeof x === 'string' ? { e: x, t: -k }   // old format: list, newest first
                                       : (x && typeof x.e === 'string' ? { e: x.e, t: Number(x.t) || 0 } : null))
                         .filter(Boolean).slice(0, MAX_RECENT);
          if (slots.length) return slots;
        }
      } catch (e) { /* unreadable: defaults */ }
      return DEFAULT_RECENT.map((e, k) => ({ e, t: -k }));
    }
    function saveSlots(slots) {
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(slots)); } catch (err) { /* private mode */ }
    }
    function renderRecent() {
      const box = document.getElementById('emote-recent');
      box.textContent = '';
      loadSlots().forEach(({ e }) => {
        const b = document.createElement('button');
        b.textContent = e;
        b.onclick = () => sendEmote(e);
        box.appendChild(b);
      });
    }
    function rememberRecent(e) {
      const slots = loadSlots();
      const now = Date.now();
      const hit = slots.find(x => x.e === e);
      if (hit) { hit.t = now; saveSlots(slots); return; }      // already shown: same place, no re-render
      if (slots.length < MAX_RECENT) slots.push({ e, t: now });
      else {
        let old = 0;
        slots.forEach((x, k) => { if (x.t < slots[old].t) old = k; });
        slots[old] = { e, t: now };                               // replace in place
      }
      saveSlots(slots);
      renderRecent();
    }
    function sendEmote(e) {
      rememberRecent(e);
      if (KEYWORD[e]) sendSticker(KEYWORD[e]); else sendSticker('custom', e);
    }

    let pickerTab = 0;
    function openPicker() {
      const tabs = document.getElementById('emoji-tabs');
      if (!tabs.childElementCount) {
        EMOJI_GROUPS.forEach((g, i) => {
          const b = document.createElement('button');
          b.textContent = g.icon;
          b.title = g.name;
          b.onclick = () => showTab(i);
          tabs.appendChild(b);
        });
      }
      document.getElementById('emoji-sheet').classList.remove('hidden');
      showTab(pickerTab);
    }
    function showTab(i) {
      pickerTab = i;
      const g = EMOJI_GROUPS[i];
      Array.from(document.getElementById('emoji-tabs').children).forEach((b, k) => b.classList.toggle('on', k === i));
      document.getElementById('emoji-title').textContent = g.name;
      const grid = document.getElementById('emoji-grid');
      grid.textContent = '';
      grid.scrollTop = 0;
      const frag = document.createDocumentFragment();
      g.list.forEach(e => {
        const b = document.createElement('button');
        b.textContent = e;
        frag.appendChild(b);
      });
      grid.appendChild(frag);
    }
    // One listener for the whole grid.
    document.getElementById('emoji-grid').addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      closePicker();
      sendEmote(b.textContent);
    });
    function closePicker() {
      document.getElementById('emoji-sheet').classList.add('hidden');
    }
    renderRecent();

    function launchApp(appId) {
      if (window.AndroidBridge && window.AndroidBridge.startMiniApp) {
        window.AndroidBridge.startMiniApp(appId);
      }
    }

    function setOpen(open) {
      document.getElementById('tray').classList.toggle('hidden', !open);
      document.getElementById('chip').classList.toggle('hidden', open);
    }
  </script>

  <script>
    // Send sticker action to native Go backend via the W3C IMSDataChannelBridge
    function sendSticker(emojiType, emoji) {
      console.log("[MiniApp] Sending sticker type: " + emojiType + (emoji ? " " + emoji : ""));

      const payload = {
        service: "fun-calling",
        action: "send_emoji",
        type: emojiType
      };
      if (emoji) payload.emoji = emoji; // any emoji from the keyboard; older pages show ❤️ for "custom"

      const payloadStr = JSON.stringify(payload);
      if (window.AndroidBridge && typeof window.AndroidBridge.sendData === 'function') {
        window.AndroidBridge.sendData(payloadStr);
      } else if (window.IMSDataChannelBridge && typeof window.IMSDataChannelBridge.send === 'function') {
        window.IMSDataChannelBridge.send(1000, payloadStr);
      }

      // Self-render on originating side for quick responsiveness
      renderEmoji(emojiType, emoji);
    }

    // Standard receive callback called by the container
    window.receiveData = function (dataStr) {
      console.log("[MiniApp] Received payload: " + dataStr);
      try {
        const payload = typeof dataStr === 'object' ? dataStr : JSON.parse(dataStr);
        if (payload.action === "render_emoji" || payload.action === "send_emoji") {
          renderEmoji(payload.type, payload.emoji);
        }
      } catch (e) {
        console.error("[MiniApp] Parse failed: " + e.message);
      }
    };

    // GSMA bridge may call this callback for every incoming message.
    window._handleMessageFromNative = function () { };

    // Force the WebView to actually repaint DOM changes made from native.
    function forceRepaint() {
      const area = document.getElementById("animation-area");
      if (!area) return;
      void area.offsetHeight; // force synchronous reflow
      area.style.webkitTransform = "translateZ(0)"; // force layer invalidation
      area.style.webkitTransform = "";
    }

    // Render floating sticker animation
    function renderEmoji(emojiType, emoji) {
      const area = document.getElementById("animation-area");
      if (!area) return;

      const div = document.createElement("div");
      div.className = "floating-emoji";

      // Randomize initial horizontal position
      const leftPercent = 10 + Math.random() * 80;
      div.style.left = leftPercent + "%";

      let emojiIcon = "❤️";
      if (emojiType === "like") emojiIcon = "👍";
      if (emojiType === "smile") emojiIcon = "😊";
      if (emojiType === "angry") emojiIcon = "😡";
      if (emojiType === "wave") emojiIcon = "👋";
      // A keyboard emoji from the other phone: shown as text only, never as HTML, and kept short.
      // Only a real emoji is shown; anything else (text from a modified page) falls back to ❤️.
      if (typeof emoji === "string" && emoji.length > 0 && emoji.length <= 16 &&
          /^[\p{Extended_Pictographic}\p{Regional_Indicator}\p{Emoji_Component}\u200d\ufe0f\u20e3]+$/u.test(emoji)) emojiIcon = emoji;

      const icon = document.createElement("span");
      icon.className = "emoji-icon";
      icon.textContent = emojiIcon;
      div.appendChild(icon);
      area.appendChild(div);

      // Force repaint on the next frame (critical for transparent HW-accel WebView)
      requestAnimationFrame(forceRepaint);

      // Clean up DOM node once animation finishes
      setTimeout(() => {
        div.remove();
        requestAnimationFrame(forceRepaint);
      }, 2300);
    }

    // Auto-request Data Channel upon loading
    window.onload = function () {
      console.log("[MiniApp] Fun calling initialized, requesting data channel connectivity");
      if (window.ImsDcBridge && window.ImsDcBridge.createDataChannel) {
        window.ImsDcBridge.createDataChannel("fun-calling-app");
      } else if (window.AndroidBridge && window.AndroidBridge.createDataChannel) {
        window.AndroidBridge.createDataChannel("fun-calling-app");
      } else if (window._dsbridge && window._dsbridge.call) {
        window._dsbridge.call("dc.createAppDataChannel", JSON.stringify({ dcLabels: ["control_fun-calling-app_0"] }));
      }
    };
  </script>
