<!DOCTYPE html>
<html lang="vi" class="full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bảng vẽ — 5G New Calling</title>
  <style>
    :root {
      --glass-bg: rgba(22, 24, 30, 0.72);
      --glass-bg-heavy: rgba(18, 20, 26, 0.88);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --accent: #0a84ff;
      --accent-glow: rgba(10, 132, 255, 0.35);
      --danger: #ff453a;
      --success: #30d158;
      --text-main: #f5f7fa;
      --text-muted: rgba(235, 235, 245, 0.6);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, sans-serif;
      color: var(--text-main);
    }

    /* Opaque whiteboard covering the entire app viewport. */
    #board {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    /* ── Top HUD: Connection Status ── */
    #topBar {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 14px;
      right: 14px;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-spacer { width: 68px; }

    .status-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      color: var(--text-main);
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 var(--glass-highlight);
      transition: transform 0.25s var(--spring), border-color 0.25s;
    }

    #peerDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #peerDot.live {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulseDot 1.8s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.75; }
    }

    #peerLbl {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11.5px;
    }


    /* ── Toast & Transfer Progress ── */
    #hudAlerts {
      position: fixed;
      top: calc(56px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: max-content;
      max-width: 88vw;
    }

    #toast {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      background: var(--glass-bg-heavy);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
      opacity: 0;
      transform: translateY(-10px) scale(0.94);
      transition: opacity 0.25s, transform 0.25s var(--spring);
      text-align: center;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #progress {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--glass-bg-heavy);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
    }
    #progress.on { display: inline-flex; }
    #progress .bar {
      width: 76px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }
    #progress .bar i {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: 2px;
      background: var(--accent);
      animation: slideBar 1.05s ease-in-out infinite;
    }
    @keyframes slideBar {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    /* ── Floating Popovers (Brush Studio & Clear Menu) ── */
    .popover {
      position: fixed;
      bottom: calc(84px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(14px) scale(0.94);
      z-index: 42;
      background: var(--glass-bg-heavy);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 14px 16px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48), inset 0 1px 0 var(--glass-highlight);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.26s var(--spring);
      width: max-content;
      max-width: calc(100vw - 24px);
    }
    .popover.open {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
    }

    .popover-section-lbl {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Brush Studio */
    #widths {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 16px;
    }
    #widths .w {
      flex: 1;
      height: 36px;
      min-width: 52px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    #widths .w.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    #widths .w i {
      border-radius: 50%;
      background: currentColor;
      display: block;
      transition: transform 0.2s;
    }

    #colors {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    #colors .c {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s var(--spring), border-color 0.2s, box-shadow 0.2s;
    }
    #colors .c:active { transform: scale(0.88); }
    #colors .c.active {
      border-color: #fff;
      transform: scale(1.12);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
    }

    /* Clear Popover Menu */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 210px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, transform 0.12s;
    }
    .menu-item:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.14);
    }
    .menu-item.danger { color: #ff6961; }
    .menu-item[disabled] {
      opacity: 0.35;
      pointer-events: none;
    }
    .menu-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .menu-item .sub {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    /* ── Main Bottom Dock ── */
    #pill {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      max-width: calc(100vw - 20px);
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42), inset 0 1px 0 var(--glass-highlight);
      transition: opacity 0.28s, transform 0.32s var(--spring);
    }
    #pill.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(24px) scale(0.85);
      pointer-events: none;
    }

    #pill button.tool {
      position: relative;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.16s var(--spring), background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    #pill button.tool svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
    #pill button.tool:active { transform: scale(0.88); }
    #pill button.tool.active {
      background: rgba(10, 132, 255, 0.24);
      border-color: rgba(88, 166, 255, 0.65);
      color: #fff;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    #pill button.tool[disabled] {
      opacity: 0.28;
      pointer-events: none;
    }

    /* Nút chọn màu & nét tích hợp chấm hiển thị trực quan */
    #btnStyle {
      background: rgba(255, 255, 255, 0.1);
    }
    #stylePreviewDot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ff3b30;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: background 0.2s, transform 0.2s var(--spring);
    }
    #styleSizeBadge {
      position: absolute;
      bottom: 3px;
      right: 3px;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border-radius: 999px;
      background: #1c1c1e;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Badge báo có ảnh nền trên nút Photo */
    #photoDot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      display: none;
    }
    #photoDot.on { display: block; }

    .sep {
      width: 1px;
      height: 24px;
      flex: 0 0 1px;
      margin: 0 2px;
      background: rgba(255, 255, 255, 0.14);
    }

    /* ── Floating Action Chip (mở lại thanh công cụ khi đang vẽ) ── */
    #chip {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 18px;
      z-index: 39;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-heavy);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      cursor: pointer;
      transition: opacity 0.22s, transform 0.26s var(--spring);
    }
    #chip svg { width: 22px; height: 22px; }
    #chip:active { transform: scale(0.9); }
    #chip.hidden {
      opacity: 0;
      transform: scale(0.5) translateY(20px);
      pointer-events: none;
    }
    #chipColorRing {
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      border: 2px solid #ff3b30;
      opacity: 0.85;
      pointer-events: none;
    }

    /* Match the content-sharing app's native full-screen overlays. */
    html.full #topBar {
      left: calc(116px + env(safe-area-inset-left, 0px));
      right: calc(14px + env(safe-area-inset-right, 0px));
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }
    html.full .hud-spacer { display: none; }
    html.full .status-pill { max-width: 100%; flex-wrap: wrap; }
    html.full #hudAlerts { top: calc(112px + var(--safe-top)); }
    html.full #pill { bottom: calc(60px + var(--safe-bottom)); }
    html.full .popover { bottom: calc(128px + var(--safe-bottom)); }
    html.full #chip { bottom: calc(64px + var(--safe-bottom)); }

    /* Full viewport stage, just like the photo/video sharing viewer.
       Fit the entire photo without stretching or cropping; unused space is black. */
    html.photo-view, html.photo-view body, html.photo-view #board { background: #000; }
    #pill { gap: 4px; padding-inline: 8px; }
    #pill button.tool {
      width: clamp(36px, 10vw, 44px);
      height: clamp(36px, 10vw, 44px);
      flex: 0 0 clamp(36px, 10vw, 44px);
    }
    input[type=file] { display: none; }
  </style>
</head>
<body>

<canvas id="board"></canvas>

<!-- Top HUD -->
<div id="topBar">
  <div class="hud-spacer"></div>
  <div class="status-pill">
    <span id="peerDot"></span>
    <span>Bảng vẽ 5G</span>
    <span id="peerLbl"></span>
  </div>
</div>

<!-- Alerts & Transfer Progress -->
<div id="hudAlerts">
  <div id="progress">
    <div class="bar"><i></i></div>
    <span id="progressLbl">Đang truyền</span>
  </div>
  <div id="toast"></div>
</div>

<!-- Popover 1: Brush Studio (Color + Stroke Width) -->
<div class="popover" id="stylePopover">
  <div class="popover-section-lbl">
    <span>Độ dày nét bút</span>
    <span id="widthLblVal">Vừa (4px)</span>
  </div>
  <div id="widths">
    <button class="w" data-w="2" data-lbl="Mảnh (2px)" title="Nét mảnh">
      <i style="width:4px;height:4px"></i><span>Mảnh</span>
    </button>
    <button class="w active" data-w="4" data-lbl="Vừa (4px)" title="Nét vừa">
      <i style="width:8px;height:8px"></i><span>Vừa</span>
    </button>
    <button class="w" data-w="9" data-lbl="Đậm (9px)" title="Nét đậm">
      <i style="width:13px;height:13px"></i><span>Đậm</span>
    </button>
    <button class="w" data-w="16" data-lbl="Bút dạ (16px)" title="Bút dạ lớn">
      <i style="width:17px;height:17px"></i><span>Dạ</span>
    </button>
  </div>
  <div class="popover-section-lbl"><span>Màu mực</span></div>
  <div id="colors">
    <div class="c active" style="background:#ff3b30" data-color="#ff3b30" title="Đỏ"></div>
    <div class="c" style="background:#ff9500" data-color="#ff9500" title="Cam"></div>
    <div class="c" style="background:#ffd60a" data-color="#ffd60a" title="Vàng"></div>
    <div class="c" style="background:#30d158" data-color="#30d158" title="Xanh lá"></div>
    <div class="c" style="background:#0a84ff" data-color="#0a84ff" title="Xanh dương"></div>
    <div class="c" style="background:#bf5af2" data-color="#bf5af2" title="Tím"></div>
    <div class="c" style="background:#ffffff" data-color="#ffffff" title="Trắng"></div>
    <div class="c" style="background:#1c1c1e; border-color:rgba(255,255,255,0.5)" data-color="#1c1c1e" title="Đen"></div>
  </div>
</div>

<!-- Popover 2: Clear Menu (Explicit Stroke vs Photo Clear) -->
<div class="popover" id="clearPopover">
  <div class="menu-list">
    <button class="menu-item" id="actClearStrokes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/>
        <path d="M17 17L7 7"/>
      </svg>
      <div>
        <div>Xóa toàn bộ nét vẽ</div>
        <span class="sub">Giữ nguyên ảnh nền hiện tại</span>
      </div>
    </button>
    <button class="menu-item danger" id="actClearPhoto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>
      <div>
        <div>Gỡ bỏ ảnh nền</div>
        <span class="sub">Nhấn giữ nút Xóa để gỡ nhanh</span>
      </div>
    </button>
  </div>
</div>

<!-- Bottom Control Dock -->
<div id="pill">
  <button class="tool active" id="btnPen" title="Bút vẽ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19l7-7 3 3-7 7-3-3z"/>
      <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
      <path d="M2 2l7.586 7.586"/>
      <circle cx="11" cy="11" r="2"/>
    </svg>
  </button>

  <button class="tool" id="btnEraser" title="Tẩy nét (chạm hoặc kéo qua nét muốn xóa)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
      <path d="M22 21H7"/>
      <path d="m5 11 9 9"/>
    </svg>
  </button>

  <button class="tool" id="btnStyle" title="Màu mực & Độ dày nét">
    <span id="stylePreviewDot"></span>
    <span id="styleSizeBadge">4</span>
  </button>

  <div class="sep"></div>

  <button class="tool" id="btnUndo" title="Hoàn tác" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7v6h6"/>
      <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
    </svg>
  </button>

  <button class="tool" id="btnPhoto" title="Chèn ảnh nền">
    <span id="photoDot"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </button>

  <button class="tool" id="btnClear" title="Xóa nét hoặc gỡ ảnh nền">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </svg>
  </button>

</div>

<!-- Minimized Quick Chip -->
<button id="chip" class="hidden" aria-label="Mở thanh công cụ">
  <span id="chipColorRing"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
  </svg>
</button>

<input type="file" id="fileInput" accept="image/*">

<script>
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════
   * BẢNG VẼ (sketch-sync-app v2.2 Pro UI) — Air-gapped 5G New Calling
   * Tương thích 100% giao thức ADC stream 1000 & native PhotoTransport.
   * ═══════════════════════════════════════════════════════════════════ */

  const $ = id => document.getElementById(id);
  const state = {
    color: '#ff3b30',
    penW: 4,
    mode: 'pen',                    // 'pen' | 'eraser'
    photo: null,                    // {id, url, img, ready}
    remoteDrafts: new Map(),       // In-progress peer strokes, separate from undo history.
    strokes: [],                    // {id, mine, color, w, pts:[[x,y]..]}
    pendingPhoto: null,             // ảnh đang chờ fetch từ xa
    lastBackup: null,               // {kind:'strokes',strokes:[..]} | {kind:'photo',photo:{..}}
    peerActiveAt: 0,                // presence: thời điểm msg cuối từ đối phương
    eraserCursors: new Map(),       // One cursor per erasing finger.
  };
  let seq = 0;
  const strokeClientId = window.crypto && typeof window.crypto.randomUUID === 'function'
    ? window.crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
  const newId = () => 's' + strokeClientId + '_' + (seq++).toString(36);
  const myStrokes = () => state.strokes.filter(s => s.mine);

  /* ─────────────── Bridge helpers ─────────────── */
  function sendJson(obj) {
    const s = JSON.stringify(obj);
    if (window.AndroidBridge && window.AndroidBridge.send) {
      window.AndroidBridge.send(1000, s);
    } else if (window.AndroidBridge && window.AndroidBridge.sendData) {
      window.AndroidBridge.sendData(s);
    } else {
      console.warn('[SK] no bridge', s);
    }
  }

  /* ─────────────── Toast / progress / haptic ─────────────── */
  let toastTimer = null;
  function toast(msg, ms) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
  }
  function showProgress(label) {
    $('progressLbl').textContent = label || 'Đang truyền';
    $('progress').classList.add('on');
  }
  function hideProgress() {
    $('progress').classList.remove('on');
  }
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern || 8); } catch (e) {}
  }

  /* ─────────────── Popovers Management ─────────────── */
  function closePopovers() {
    $('stylePopover').classList.remove('open');
    $('clearPopover').classList.remove('open');
  }
  function togglePopover(id) {
    const target = $(id);
    const isOpen = target.classList.contains('open');
    closePopovers();
    if (!isOpen) {
      updateToolbar();
      target.classList.add('open');
      resetPillIdle();
    }
  }

  /* ═══════════════ CANVAS & VẼ ═══════════════ */
  const board = $('board');
  const ctx = board.getContext('2d');
  const localDrafts = new Map(); // pointerId -> independent in-progress stroke.
  const pointerTools = new Map();
  const ignoredStrokeIds = new Set();
  let strokeFlushTimer = null;
  let paintFrame = null;

  // Multiple fingers and incoming peer packets share one paint per display frame.
  function redraw() {
    if (paintFrame !== null) return;
    paintFrame = requestAnimationFrame(() => {
      paintFrame = null;
      paintBoard();
    });
  }

  function sizeBoard() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    board.width = Math.round(w * dpr);
    board.height = Math.round(h * dpr);
    board.style.width = w + 'px';
    board.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function baseRect() {
    const p = state.photo;
    if (!p || !p.img || !p.img.naturalWidth) return null;
    const k = Math.min(window.innerWidth / p.img.naturalWidth, window.innerHeight / p.img.naturalHeight);
    const w = p.img.naturalWidth * k, h = p.img.naturalHeight * k;
    return { x: (window.innerWidth - w) / 2, y: (window.innerHeight - h) / 2, width: w, height: h };
  }

  function viewRect() { return baseRect(); } // Always fit the image to the screen.

  function paintBoard() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.save();
    document.documentElement.classList.toggle('photo-view', Boolean(state.photo));
    ctx.fillStyle = state.photo ? '#000000' : '#ffffff';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    ctx.restore();
    const r = viewRect();
    if (r && state.photo && state.photo.img) {
      ctx.drawImage(state.photo.img, r.x, r.y, r.width, r.height);
    }
    const highlighted = new Set(Array.from(state.eraserCursors.values(), c => c.hitId));
    state.strokes.forEach(st => renderStroke(ctx, st, null, highlighted.has(st.id)));
    state.remoteDrafts.forEach(st => renderStroke(ctx, st));
    localDrafts.forEach(st => renderStroke(ctx, st));

    // Vẽ tâm tẩy trực quan khi đang ở chế độ Eraser
    state.eraserCursors.forEach(cursor => {
      ctx.save();
      if (r) {
        ctx.beginPath();
        ctx.rect(r.x, r.y, r.width, r.height);
        ctx.clip();
      }
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, 18, 0, Math.PI * 2);
      ctx.fillStyle = cursor.hitId ? 'rgba(255, 69, 58, 0.28)' : 'rgba(28, 28, 30, 0.10)';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = cursor.hitId ? '#ff453a' : 'rgba(28, 28, 30, 0.65)';
      ctx.stroke();
      ctx.restore();
    });
  }

  function renderStroke(c, st, extra, isHighlighted) {
    if (!st.pts || !st.pts.length) return;
    const r = viewRect();
    if (state.photo && !r) return; // Wait for the image's real bounds.
    const fx = r ? r.x : 0, fy = r ? r.y : 0;
    const fw = r ? r.width : window.innerWidth, fh = r ? r.height : window.innerHeight;
    const scale = 1;
    const pts = extra ? st.pts.concat([extra]) : st.pts;
    const X = p => fx + p[0] * fw, Y = p => fy + p[1] * fh;

    c.save();
    if (r) {
      c.beginPath();
      c.rect(r.x, r.y, r.width, r.height);
      c.clip(); // Includes pen caps, thick strokes, and strokes received from the peer.
    }
    const lineW = (st.w || 4) * scale;
    c.strokeStyle = isHighlighted ? '#ff453a' : st.color;
    c.lineWidth = isHighlighted ? lineW + 3 : lineW;
    c.lineJoin = c.lineCap = 'round';
    if (isHighlighted) c.globalAlpha = 0.65;

    if (pts.length === 1) {
      c.beginPath();
      c.arc(X(pts[0]), Y(pts[0]), lineW / 2, 0, Math.PI * 2);
      c.fillStyle = isHighlighted ? '#ff453a' : st.color;
      c.fill();
      c.restore();
      return;
    }
    c.beginPath();
    c.moveTo(X(pts[0]), Y(pts[0]));
    if (pts.length === 2) {
      c.lineTo(X(pts[1]), Y(pts[1]));
    } else {
      for (let i = 1; i < pts.length - 1; i++) {
        c.quadraticCurveTo(
          X(pts[i]), Y(pts[i]),
          (X(pts[i]) + X(pts[i + 1])) / 2,
          (Y(pts[i]) + Y(pts[i + 1])) / 2
        );
      }
      c.lineTo(X(pts[pts.length - 1]), Y(pts[pts.length - 1]));
    }
    c.stroke();
    c.restore();
  }

  function normPoint(cx, cy) {
    const r = viewRect();
    if (!r) return [cx / window.innerWidth, cy / window.innerHeight];
    return [
      Math.min(1, Math.max(0, (cx - r.x) / r.width)),
      Math.min(1, Math.max(0, (cy - r.y) / r.height))
    ];
  }

  // Batch deltas for every active finger; the final full stroke repairs previews.
  function flushDraft(stroke) {
    while (stroke.sentPointCount < stroke.pts.length) {
      const from = stroke.sentPointCount;
      const pts = stroke.pts.slice(from, from + 64);
      stroke.sentPointCount += pts.length;
      sendJson({ t: 'stroke.points', id: stroke.id, from, pts });
    }
  }

  function flushStrokePoints() {
    clearTimeout(strokeFlushTimer);
    strokeFlushTimer = null;
    localDrafts.forEach(flushDraft);
  }

  function scheduleStrokePoints() {
    if (strokeFlushTimer === null) strokeFlushTimer = setTimeout(flushStrokePoints, 33);
  }

  function stopIdleFlush() {
    if (localDrafts.size) return;
    clearTimeout(strokeFlushTimer);
    strokeFlushTimer = null;
  }

  function cancelLocalStroke(pointerId, sync = true) {
    const draft = localDrafts.get(pointerId);
    localDrafts.delete(pointerId);
    stopIdleFlush();
    if (draft && sync) sendJson({ t: 'stroke.cancel', id: draft.id });
  }

  function resetLiveStrokes(sync = false) {
    Array.from(localDrafts.keys()).forEach(id => cancelLocalStroke(id, sync));
    state.remoteDrafts.forEach(st => ignoredStrokeIds.add(st.id));
    state.remoteDrafts.clear();
    state.eraserCursors.clear();
    pointerTools.clear();
  }

  function validStrokePoints(pts) {
    return Array.isArray(pts) && pts.length > 0 && pts.every(p =>
      Array.isArray(p) && p.length === 2 && p.every(Number.isFinite));
  }

  function matchesPhoto(msg) {
    return msg.photoId === undefined || msg.photoId === (state.photo ? state.photo.id : null);
  }

  function onStrokeStart(msg) {
    if (!msg.id || ignoredStrokeIds.has(msg.id) || !matchesPhoto(msg) || !validStrokePoints(msg.pts)) return;
    if (state.strokes.some(s => s.id === msg.id) || state.remoteDrafts.has(msg.id)) return;
    state.remoteDrafts.set(msg.id, { id: msg.id, mine: false, color: msg.color, w: msg.w, pts: msg.pts.slice() });
    redraw();
    updateToolbar();
  }

  function onStrokePoints(msg) {
    const draft = state.remoteDrafts.get(msg.id);
    if (!draft || !validStrokePoints(msg.pts) || !Number.isInteger(msg.from) || msg.from < 0) return;
    // Ignore duplicate points and wait for the final stroke if a preview chunk is missing.
    if (msg.from > draft.pts.length) return;
    draft.pts.push(...msg.pts.slice(Math.max(0, draft.pts.length - msg.from)));
    redraw();
  }

  function onStrokeComplete(msg) {
    state.remoteDrafts.delete(msg.id);
    if (ignoredStrokeIds.has(msg.id)) { redraw(); return; }
    if (!matchesPhoto(msg) || !validStrokePoints(msg.pts)) { redraw(); return; }
    const stroke = { id: msg.id || newId(), mine: false, color: msg.color, w: msg.w, pts: msg.pts };
    const index = state.strokes.findIndex(s => s.id === stroke.id);
    if (index < 0) state.strokes.push(stroke);
    else state.strokes[index] = stroke;
    redraw();
    updateToolbar();
  }

  function canDrawAt(x, y) {
    if (!state.photo) return true;
    const r = viewRect();
    return Boolean(r && x >= r.x && x <= r.x + r.width &&
      y >= r.y && y <= r.y + r.height);
  }

  // End the stroke exactly where the segment exits the photo, without drawing
  // a line along the border or joining across an excursion outside the image.
  function photoExitPoint(last, x, y) {
    const r = viewRect();
    if (!r) return last;
    const end = [(x - r.x) / r.width, (y - r.y) / r.height];
    const dx = end[0] - last[0], dy = end[1] - last[1];
    let t = 1;
    if (end[0] < 0) t = Math.min(t, -last[0] / dx);
    if (end[0] > 1) t = Math.min(t, (1 - last[0]) / dx);
    if (end[1] < 0) t = Math.min(t, -last[1] / dy);
    if (end[1] > 1) t = Math.min(t, (1 - last[1]) / dy);
    return [Math.max(0, Math.min(1, last[0] + t * dx)),
      Math.max(0, Math.min(1, last[1] + t * dy))];
  }

  /* Each finger owns its own stroke. Two fingers draw two lines; no gestures. */
  function commitStroke(pointerId) {
    const stroke = localDrafts.get(pointerId);
    if (!stroke) return;
    if (stroke.photoId !== (state.photo ? state.photo.id : null)) {
      cancelLocalStroke(pointerId); redraw(); return;
    }
    flushDraft(stroke);
    localDrafts.delete(pointerId);
    stopIdleFlush();
    fitStrokeMessage(stroke);
    state.strokes.push(stroke);
    sendJson({ t: 'stroke', id: stroke.id, photoId: stroke.photoId,
      color: stroke.color, w: stroke.w, pts: stroke.pts });
    updateToolbar();
    redraw();
  }

  /* Kênh dữ liệu nhận tối đa 64 KB một tin: một nét rất dài được lược bớt điểm (bỏ 1 điểm mỗi 2, giữ điểm cuối)
   * tới khi vừa. Nét trên máy mình đổi theo, để hai máy giữ đúng cùng một nét. */
  const MAX_STROKE_MSG = 60000;
  function fitStrokeMessage(stroke) {
    const size = () => JSON.stringify({ t: 'stroke', id: stroke.id, photoId: stroke.photoId, color: stroke.color, w: stroke.w, pts: stroke.pts }).length;
    while (stroke.pts.length > 2 && size() > MAX_STROKE_MSG) {
      const last = stroke.pts[stroke.pts.length - 1];
      stroke.pts = stroke.pts.filter((_, i) => i % 2 === 0);
      if (stroke.pts[stroke.pts.length - 1] !== last) stroke.pts.push(last);
    }
  }

  function eraseAt(pointerId, x, y) {
    if (!canDrawAt(x, y)) { state.eraserCursors.delete(pointerId); redraw(); return; }
    const hit = hitStroke(x, y);
    state.eraserCursors.set(pointerId, { x, y, hitId: hit ? hit.id : null });
    if (hit) removeStroke(hit.id, true);
    redraw();
  }

  function appendStrokePoint(pointerId, x, y, force = false) {
    const stroke = localDrafts.get(pointerId);
    if (!stroke || !Number.isFinite(x) || !Number.isFinite(y)) return;
    if (stroke.photoId !== (state.photo ? state.photo.id : null)) {
      cancelLocalStroke(pointerId); redraw(); return;
    }
    const last = stroke.pts[stroke.pts.length - 1];
    if (!canDrawAt(x, y)) {
      if (viewRect()) stroke.pts.push(photoExitPoint(last, x, y));
      commitStroke(pointerId); // Only this finger stops at the photo border.
      return;
    }
    const pt = normPoint(x, y), r = viewRect();
    const distance = Math.hypot((pt[0] - last[0]) * (r ? r.width : window.innerWidth),
      (pt[1] - last[1]) * (r ? r.height : window.innerHeight));
    if (distance < (force ? 0.01 : 0.5)) return;
    stroke.pts.push(pt);
    redraw();
    scheduleStrokePoints();
  }

  board.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    closePopovers();
    if (pointerTools.has(e.pointerId) || !canDrawAt(e.clientX, e.clientY)) return;
    pointerTools.set(e.pointerId, state.mode);
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
    collapsePill();
    if (state.mode === 'eraser') { eraseAt(e.pointerId, e.clientX, e.clientY); return; }
    const stroke = {
      id: newId(), mine: true, photoId: state.photo ? state.photo.id : null,
      color: state.color, w: state.penW,
      pts: [normPoint(e.clientX, e.clientY)], sentPointCount: 1,
    };
    localDrafts.set(e.pointerId, stroke);
    redraw();
    sendJson({ t: 'stroke.start', id: stroke.id, photoId: stroke.photoId,
      color: stroke.color, w: stroke.w, pts: stroke.pts.slice() });
    updateToolbar();
  });

  board.addEventListener('pointermove', e => {
    const tool = pointerTools.get(e.pointerId);
    if (!tool) return;
    e.preventDefault();
    // Coalesced samples preserve fast curves between display frames.
    let samples = [];
    try { if (typeof e.getCoalescedEvents === 'function') samples = e.getCoalescedEvents(); } catch (_) {}
    for (const point of samples) {
      if (tool === 'eraser') eraseAt(e.pointerId, point.clientX, point.clientY);
      else appendStrokePoint(e.pointerId, point.clientX, point.clientY);
    }
    if (tool === 'eraser') eraseAt(e.pointerId, e.clientX, e.clientY);
    else appendStrokePoint(e.pointerId, e.clientX, e.clientY);
  });

  function finishPointer(e) {
    const tool = pointerTools.get(e.pointerId);
    if (!tool) return;
    if (e.type === 'pointerup') {
      if (tool === 'eraser') eraseAt(e.pointerId, e.clientX, e.clientY);
      else {
        appendStrokePoint(e.pointerId, e.clientX, e.clientY, true);
        commitStroke(e.pointerId); // Capture the final release point too.
      }
    } else cancelLocalStroke(e.pointerId);
    pointerTools.delete(e.pointerId);
    state.eraserCursors.delete(e.pointerId);
    stopIdleFlush();
    redraw();
    updateToolbar();
  }
  board.addEventListener('pointerup', finishPointer);
  board.addEventListener('pointercancel', finishPointer);
  board.addEventListener('lostpointercapture', finishPointer);

  // The canvas owns touch input; native pinch/double-tap/page scrolling is disabled.
  board.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  board.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

  /** Khoảng cách từ điểm P tới đoạn thẳng AB (giúp tẩy nhạy cả với nét vẩy nhanh). */
  function distToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(px - ax, py - ay);
    const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  function hitStroke(cx, cy) {
    if (!canDrawAt(cx, cy)) return null;
    const r = viewRect();
    const fx = r ? r.x : 0, fy = r ? r.y : 0;
    const fw = r ? r.width : window.innerWidth, fh = r ? r.height : window.innerHeight;
    const scale = 1;
    let best = null, bestD = Infinity;

    for (const st of state.strokes) {
      const thr = ((st.w || 4) * scale) / 2 + 16;
      const pts = st.pts;
      if (!pts || !pts.length) continue;
      if (pts.length === 1) {
        const d = Math.hypot(cx - (fx + pts[0][0] * fw), cy - (fy + pts[0][1] * fh));
        if (d < thr && d < bestD) { best = st; bestD = d; }
        continue;
      }
      for (let i = 0; i < pts.length - 1; i++) {
        const ax = fx + pts[i][0] * fw, ay = fy + pts[i][1] * fh;
        const bx = fx + pts[i + 1][0] * fw, by = fy + pts[i + 1][1] * fh;
        const d = distToSegment(cx, cy, ax, ay, bx, by);
        if (d < thr && d < bestD) { best = st; bestD = d; }
      }
    }
    return best;
  }

  function removeStroke(id, sync) {
    const i = state.strokes.findIndex(s => s.id === id);
    if (i < 0) return;
    state.strokes.splice(i, 1);
    redraw();
    if (sync) sendJson({ t: 'erase', id });
    updateToolbar();
  }

  /* ═══════════════ THANH CÔNG CỤ ═══════════════ */
  function updateToolbar() {
    $('btnUndo').disabled = myStrokes().length === 0 && !state.lastBackup;
    $('photoDot').classList.toggle('on', Boolean(state.photo));
    $('actClearStrokes').disabled = state.strokes.length === 0 && localDrafts.size === 0 && state.remoteDrafts.size === 0;
    $('actClearPhoto').disabled = !state.photo;
    $('stylePreviewDot').style.background = state.color;
    $('chipColorRing').style.borderColor = state.color;
    $('styleSizeBadge').textContent = state.penW;
  }

  function setTool(id) {
    ['btnPen', 'btnEraser'].forEach(x => $(x).classList.toggle('active', x === id));
  }

  $('btnPen').onclick = () => {
    state.mode = 'pen';
    setTool('btnPen');
    closePopovers();
    resetPillIdle();
  };

  $('btnEraser').onclick = () => {
    state.mode = 'eraser';
    setTool('btnEraser');
    closePopovers();
    toast('Chạm hoặc kéo qua nét để xóa');
    resetPillIdle();
  };

  $('btnStyle').onclick = (e) => {
    e.stopPropagation();
    state.mode = 'pen';
    setTool('btnPen');
    togglePopover('stylePopover');
  };

  document.querySelectorAll('#widths .w').forEach(b => {
    b.onclick = () => {
      state.penW = Number(b.dataset.w);
      $('widthLblVal').textContent = b.dataset.lbl || (state.penW + 'px');
      document.querySelectorAll('#widths .w').forEach(x => x.classList.toggle('active', x === b));
      state.mode = 'pen';
      setTool('btnPen');
      updateToolbar();
      buzz(6);
    };
  });

  document.querySelectorAll('#colors .c').forEach(sw => {
    sw.onclick = () => {
      state.color = sw.dataset.color;
      document.querySelectorAll('#colors .c').forEach(x => x.classList.remove('active'));
      sw.classList.add('active');
      state.mode = 'pen';
      setTool('btnPen');
      updateToolbar();
      buzz(6);
      setTimeout(closePopovers, 140);
    };
  });

  /** Hoàn tác: nét của mình gần nhất; hết thì hoàn tác clear/photo-clear vừa rồi. */
  $('btnUndo').onclick = () => {
    closePopovers();
    const mine = myStrokes();
    if (mine.length) {
      removeStroke(mine[mine.length - 1].id, true);
      buzz(8);
      return;
    }
    const b = state.lastBackup;
    if (!b) return;
    state.lastBackup = null;
    if (b.kind === 'strokes') {
      state.strokes = b.strokes.map(s => ({ ...s }));
      sendJson({ t: 'clear', backup: null });
    } else {
      restorePhoto(b.photo);
      sendJson({ t: 'photo.clear', backup: null });
    }
    redraw();
    updateToolbar();
    toast('Đã hoàn tác');
    buzz(10);
  };

  /* Nút Xóa: Hỗ trợ cả Menu trực quan lẫn giữ 550ms để gỡ nhanh ảnh nền */
  let clearHold = null, clearArmed = false;
  $('btnClear').addEventListener('pointerdown', () => {
    clearArmed = false;
    clearTimeout(clearHold);
    clearHold = setTimeout(() => {
      closePopovers();
      doPhotoClear();
    }, 550);
  });
  $('btnClear').addEventListener('pointerup', () => clearTimeout(clearHold));
  $('btnClear').addEventListener('pointerleave', () => clearTimeout(clearHold));
  $('btnClear').onclick = (e) => {
    e.stopPropagation();
    if (clearArmed) return;
    // Nếu chỉ có nét (không có ảnh nền), xóa nét luôn cho nhanh; nếu có cả ảnh nền thì bật menu chọn
    if (state.photo) {
      togglePopover('clearPopover');
    } else {
      closePopovers();
      doClear();
    }
  };

  $('actClearStrokes').onclick = () => {
    closePopovers();
    doClear();
  };
  $('actClearPhoto').onclick = () => {
    closePopovers();
    doPhotoClear();
  };

  function doClear() {
    if (!state.strokes.length && !localDrafts.size && !state.remoteDrafts.size) { toast('Không còn nét để xóa'); return; }
    resetLiveStrokes(true);
    const backup = state.strokes.map(s => ({ ...s }));
    state.lastBackup = { kind: 'strokes', strokes: backup };
    state.strokes = [];
    redraw();
    updateToolbar();
    // Không gửi kèm toàn bộ nét: với nhiều nét, tin nhắn vượt giới hạn 64 KB của kênh dữ liệu và bị bỏ (máy kia
    // không xóa). Máy kia có cùng bản vẽ nên tự sao lưu nét của nó để Hoàn tác.
    sendJson({ t: 'clear', backup: true });
    toast('Đã xóa toàn bộ nét — bấm Hoàn tác để khôi phục');
    buzz([10, 40, 10]);
  }

  function doPhotoClear() {
    clearArmed = true;
    if (!state.photo) { toast('Chưa có ảnh nền để gỡ'); return; }
    resetLiveStrokes(true);
    state.lastBackup = { kind: 'photo', photo: { id: state.photo.id, url: state.photo.url } };
    state.photo = null;
    state.pendingPhoto = null;
    redraw();
    updateToolbar();
    sendJson({ t: 'photo.clear', backup: { id: state.lastBackup.photo.id } });
    toast('Đã gỡ ảnh nền — bấm Hoàn tác để khôi phục');
    buzz(14);
  }

  /* ─────────────── Pill: thu gọn khi vẽ, hiện qua chip / idle ─────────────── */
  let pillIdle = null;
  function resetPillIdle() {
    clearTimeout(pillIdle);
    pillIdle = setTimeout(() => {
      const anyPopover = $('stylePopover').classList.contains('open') || $('clearPopover').classList.contains('open');
      if (state.mode === 'pen' && !anyPopover && state.strokes.length > 0) collapsePill();
    }, 7000);
  }
  function collapsePill() {
    closePopovers();
    $('pill').classList.add('hidden');
    $('chip').classList.remove('hidden');
    clearTimeout(pillIdle);
  }
  function expandPill() {
    $('pill').classList.remove('hidden');
    $('chip').classList.add('hidden');
    resetPillIdle();
  }
  $('chip').onclick = () => { expandPill(); buzz(6); };

  /* ═══════════════ CHÈN ẢNH NỀN ═══════════════ */
  $('btnPhoto').onclick = () => {
    closePopovers();
    $('fileInput').click();
  };

  function blobToB64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1] || '');
      r.onerror = () => reject(r.error || new Error('read_failed'));
      r.readAsDataURL(blob);
    });
  }

  async function fileToJpegB64(file) {
    try {
      const bmp = await createImageBitmap(file);
      const MAX = 1920, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(bmp.width * k));
      c.height = Math.max(1, Math.round(bmp.height * k));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
      if (blob) return await blobToB64(blob);
    } catch (e) {}
    if (file.size > 6 * 1024 * 1024) throw new Error('ảnh quá lớn');
    return await blobToB64(file);
  }

  $('fileInput').onchange = async () => {
    const file = ($('fileInput').files || [])[0];
    $('fileInput').value = '';
    if (!file) return;
    if (!window.AndroidBridge || typeof window.AndroidBridge.importPhotoB64 !== 'function') {
      toast('Không tìm thấy AndroidBridge');
      return;
    }
    toast('Đang xử lý ảnh...');
    let b64;
    try { b64 = await fileToJpegB64(file); }
    catch (e) { toast('Không đọc được ảnh: ' + (e && e.message || e)); return; }
    const id = 'p' + Date.now();
    let res;
    try {
      res = JSON.parse(window.AndroidBridge.importPhotoB64(JSON.stringify({ id: id, data: b64, type: 'image/jpeg' })) || '{}');
    } catch (e) { toast('Lỗi khi gửi ảnh sang Android: ' + (e && e.message || e)); return; }
    if (!res.ok) { toast('Không nhập được ảnh: ' + (res.error || '?')); return; }

    if (state.strokes.length) toast('Bảng đã làm mới cho ảnh mới');

    const url = window.AndroidBridge ? window.AndroidBridge.mediaUrl(id, false) : '';
    setPhotoState({ id: id, ready: true, url: url, img: null }, { fresh: true });
    showProgress('Đang đồng bộ ảnh');
    const thumb = await thumbB64Of(id);
    sendJson({ t: 'photo', id: id, bytes: res.bytes, thumb: thumb });
  };

  async function thumbB64Of(id) {
    try {
      const url = window.AndroidBridge.mediaUrl(id, true);
      const resp = await fetch(url);
      if (!resp.ok) return '';
      const buf = new Uint8Array(await resp.arrayBuffer());
      let bin = '';
      for (let j = 0; j < buf.length; j += 0x8000) {
        bin += String.fromCharCode.apply(null, buf.subarray(j, j + 0x8000));
      }
      return btoa(bin);
    } catch (e) { return ''; }
  }

  // opts.fresh: a new image was picked here or arrived from the other phone; both phones wipe the
  // board for it (no undo back into the old picture's drawing). Undo of "Xóa ảnh nền" keeps strokes.
  function setPhotoState(p, opts) {
    if (opts && opts.fresh && p && (state.photo ? state.photo.id : null) !== p.id) {
      resetLiveStrokes();
      state.strokes = [];
      state.lastBackup = null;
    }
    if ((state.photo ? state.photo.id : null) !== (p ? p.id : null)) resetLiveStrokes(true);
    if (!p) {
      state.photo = null;
      updateToolbar();
      redraw();
      return;
    }
    if (state.photo && state.photo.url && state.photo.url.startsWith('blob:') &&
        state.photo.url !== p.url) {
      URL.revokeObjectURL(state.photo.url);
    }
    state.photo = p;
    setBoardFullScreen(true);
    if (!p.img) {
      p.img = new Image();
      p.img.onload = () => redraw();
    }
    if (p.url) p.img.src = p.url;
    updateToolbar();
    redraw();
  }

  function restorePhoto(p) {
    if (!p) return;
    const url = p.url || (window.AndroidBridge ? window.AndroidBridge.mediaUrl(p.id, false) : '');
    setPhotoState({ id: p.id, ready: true, url: url, img: null });
  }

  /* ─────────────── Nhận photo từ xa ─────────────── */
  function onRemotePhoto(msg) {
    let thumbUrl = '';
    if (msg.thumb) thumbUrl = msg.thumb.startsWith('data:') ? msg.thumb : 'data:image/jpeg;base64,' + msg.thumb;
    state.pendingPhoto = { id: msg.id, bytes: msg.bytes };
    setPhotoState({ id: msg.id, ready: false, url: thumbUrl, img: null }, { fresh: true });
    toast('Đối phương chèn ảnh nền mới · bảng đã làm mới');
    showProgress('Đang tải ảnh HD');
    sendJson({ t: 'fetch', id: msg.id });
  }

  function onFetch(msg) {
    if (!state.photo || state.photo.id !== msg.id || !window.AndroidBridge) return;
    const res = JSON.parse(window.AndroidBridge.sendPhoto(JSON.stringify({ id: msg.id })) || '{}');
    if (res.ok) sendJson({ t: 'begin', id: msg.id, chunks: res.chunks, bytes: res.bytes });
  }

  function onPshare(idHash, b64) {
    const pending = state.pendingPhoto;
    if (!pending || hash16(pending.id) !== Number(idHash)) {
      console.warn('[SK] unknown idHash', idHash);
      return;
    }
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    setPhotoState({ id: pending.id, ready: true, url: url, img: null });
    hideProgress();
    sendJson({ t: 'done', id: pending.id, ok: true });
    toast('Đã nhận ảnh nền — có thể vẽ bằng nhiều ngón');
    buzz([12, 30, 12]);
  }
  function hash16(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h & 0xffff;
  }

  /* ═══════════════ PRESENCE ═══════════════ */
  setInterval(() => {
    const live = Date.now() - state.peerActiveAt < 3000;
    $('peerDot').classList.toggle('live', live);
    $('peerLbl').textContent = live ? '· Đang tương tác' : '';
    if (live) sendJson({ t: 'ping' });
  }, 1500);

  /* ═══════════════ ĐIỂM VÀO DUY NHẤT: nhận message ═══════════════ */
  window.receiveData = function (dataStr) {
    state.peerActiveAt = Date.now();
    try {
      if (typeof dataStr === 'string' && dataStr.startsWith('PSHARE:')) {
        const parts = dataStr.split(':');
        onPshare(parts[1], parts.slice(2).join(':'));
        return;
      }
      const msg = typeof dataStr === 'object' ? dataStr : JSON.parse(dataStr);

      if (msg.type === 'draw') {
        const st = legacyStroke(msg);
        if (st) { state.strokes.push(st); redraw(); updateToolbar(); }
        return;
      }
      if (msg.type === 'clear') {
        resetLiveStrokes();
        state.photo = null; state.pendingPhoto = null; state.lastBackup = null;
        state.strokes = [];
        redraw(); updateToolbar();
        return;
      }
      if (msg.action === 'LAUNCH_APP' || msg.service) return;

      switch (msg.t) {
        case 'photo': onRemotePhoto(msg); break;
        case 'fetch': onFetch(msg); break;
        case 'begin': showProgress('Đang nhận ảnh'); break;
        case 'done':
          hideProgress();
          if (msg.ok) toast('Đã đồng bộ xong ảnh nền');
          break;

        case 'stroke.start': onStrokeStart(msg); break;
        case 'stroke.points': onStrokePoints(msg); break;
        case 'stroke.cancel':
          ignoredStrokeIds.add(msg.id);
          state.remoteDrafts.delete(msg.id);
          updateToolbar();
          redraw();
          break;
        case 'stroke': onStrokeComplete(msg); break;
        case 'erase': removeStroke(msg.id, false); break;

        case 'ping': sendJson({ t: 'pong' }); break;
        case 'pong': break;

        case 'clear':
          resetLiveStrokes();
          if (msg.backup === null) {
            if (state.lastBackup && state.lastBackup.kind === 'strokes') {
              state.strokes = state.lastBackup.strokes.map(s => ({ ...s }));
              redraw();
            }
            state.lastBackup = null;
          } else if (msg.backup === true) {
            state.lastBackup = { kind: 'strokes', strokes: state.strokes.map(s => ({ ...s })) };
            state.strokes = [];
            redraw();
          } else if (Array.isArray(msg.backup)) { // trang cũ: bản sao lưu đi kèm tin nhắn
            state.lastBackup = { kind: 'strokes', strokes: msg.backup.map(s => ({ ...s })) };
            state.strokes = [];
            redraw();
          } else {
            state.strokes = [];
            redraw();
          }
          updateToolbar();
          break;

        case 'photo.clear':
          resetLiveStrokes();
          if (msg.backup === null) {
            if (state.lastBackup && state.lastBackup.kind === 'photo') {
              restorePhoto(state.lastBackup.photo);
            }
            state.lastBackup = null;
          } else if (state.photo) {
            state.lastBackup = { kind: 'photo', photo: { id: state.photo.id, url: state.photo.url } };
            state.photo = null;
            state.pendingPhoto = null;
            redraw();
            toast('Đối phương đã gỡ ảnh nền');
          }
          updateToolbar();
          break;
      }
    } catch (err) {
      console.warn('[SK] bad message', err, dataStr && String(dataStr).slice(0, 80));
    }
  };

  function legacyStroke(m) {
    if (typeof m.fromX !== 'number' || typeof m.fromY !== 'number') return null;
    const n = v => Math.min(1, Math.max(0, v / 1000));
    return {
      id: newId(), mine: false,
      color: m.color || '#ff3b30',
      w: m.size ? Math.max(2, Math.round(m.size / 3)) : 4,
      pts: [[n(m.fromX), n(m.fromY)], [n(m.toX ?? m.fromX), n(m.toY ?? m.fromY)]],
    };
  }

  /* ─────────────── Bridge qua GSMA _dsbridge / lifecycle ─────────────── */
  // Use the same native full-screen contract as the content-sharing app.
  function setBoardFullScreen(full) {
    document.documentElement.classList.toggle('full', full);
    const bridge = window.AndroidBridge;
    if (bridge && typeof bridge.setFullScreen === 'function') {
      try { bridge.setFullScreen(full); }
      catch (err) { console.warn('[SK] setFullScreen failed', err); }
    }
  }

  window.addEventListener('load', () => {
    setBoardFullScreen(true);
    sizeBoard();
    expandPill();
    updateToolbar();
    if (window.ImsDcBridge && window.ImsDcBridge.createDataChannel) {
      window.ImsDcBridge.createDataChannel('sketch-sync-app');
    } else if (window._dsbridge) {
      try { window._dsbridge.call('createAppDataChannel', 'sketch-sync-app'); } catch (e) {}
    }
  });

  let boardActive = true;
  function resumeBoard() {
    if (!boardActive) return;
    setBoardFullScreen(true);
    sizeBoard();
  }
  window.addEventListener('focus', resumeBoard);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) resumeBoard();
  });
  window.addEventListener('resize', sizeBoard);

  window.cleanUpImsDcObjects = function () {
    boardActive = false;
    resetLiveStrokes();
    if (paintFrame !== null) cancelAnimationFrame(paintFrame);
    paintFrame = null;
    clearTimeout(pillIdle);
    setBoardFullScreen(false);
    if (state.photo && state.photo.url && state.photo.url.startsWith('blob:')) URL.revokeObjectURL(state.photo.url);
    state.photo = null; state.pendingPhoto = null; state.strokes = []; state.lastBackup = null;
  };
</script>
</body>
</html>
